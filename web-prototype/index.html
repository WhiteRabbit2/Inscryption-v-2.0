}
function cancelSel() {
  if (!G.sel || !G.b) return;
  G.sel = null;
  if (G.mode !== 'wait') G.mode = G.b.phase === 'draw' ? 'draw' : 'idle';
  itemObjs.forEach(o => { if (o) o.lift = 0; });
  refreshModeUI();
}
function deny(text) { sfx.play('deny'); if (text) say(text, { wait: false }); }

function battleClick(hit) {
  const b = G.b;
  if (!b || G.busy || b.result) return;
  if (!hit) { cancelSel(); return; }
  const k = hit.kind;
  if (k === 'bell') { if (G.mode === 'draw') { deny(); ui.prompt('Сначала возьми карту: <b>колода</b> или <b>полёвки</b>'); return; } cancelSel(); ringBell(); return; }
  if (G.mode === 'draw') { if (k === 'pile') doDraw(hit.pile); return; }
  if (k === 'pile') { say('Карту в этот ход ты уже взял.', { wait: false }); return; }
  if (k === 'item') { itemClick(hit.slot); return; }
  if (k === 'card') {
    const loc = locate(hit.uid);
    if (!loc) return;
    if (loc.where === 'hand') { handClick(loc.idx); return; }
    if (G.mode === 'sacrifice' && loc.where === 'player') { toggleSac(loc.lane); return; }
    if (G.mode === 'place' && loc.where === 'player') { placeAt(loc.lane); return; }
    if (G.mode === 'itemTarget' && loc.where === 'enemy') { useItemAt(loc.lane); return; }
    if (G.sel) cancelSel();
    return;
  }
  if (k === 'slot') {
    if (G.mode === 'place' && hit.row === 'player') { placeAt(hit.lane); return; }
    if (G.mode === 'sacrifice' && hit.row === 'player' && b.player[hit.lane]) { toggleSac(hit.lane); return; }
    if (G.mode === 'itemTarget' && hit.row === 'enemy' && b.enemy[hit.lane]) { useItemAt(hit.lane); return; }
  }
  cancelSel();
}
function locate(uid) {
  const b = G.b;
  const hi = b.hand.findIndex(c => c.uid === uid);
  if (hi >= 0) return { where: 'hand', idx: hi };
  for (const row of ['player', 'enemy', 'queue']) { const l = b[row].findIndex(c => c && c.uid === uid); if (l >= 0) return { where: row, lane: l }; }
  return null;
}
function handClick(idx) {
  const b = G.b, c = b.hand[idx];
  if (G.sel && G.sel.uid === c.uid) { cancelSel(); return; }
  if (G.mode !== 'idle' && G.mode !== 'sacrifice' && G.mode !== 'place' && G.mode !== 'itemTarget' && G.mode !== 'itemConfirm') return;
  if (G.sel) cancelSel();
  if (c.bones > b.bones) { deny(LINES.noBones); return; }
  if (c.blood > 0 && L.totalBlood(b) < c.blood) { deny(LINES.noBlood); return; }
  if (c.blood === 0 && !b.player.some(x => !x)) { deny(LINES.noLane); return; }

function toggleSac(lane) {
  const b = G.b, s = G.sel;
  const i = s.sac.indexOf(lane);
  if (i >= 0) s.sac.splice(i, 1); else { s.sac.push(lane); sfx.play('tick'); }
  let sum = s.sac.reduce((a, l) => a + L.bloodOf(b.player[l]), 0);
  // лишние жертвы не нужны: убираем самых ранних, если без них крови хватает
  for (let j = 0; j < s.sac.length && sum >= s.need; j++) {
    const v = L.bloodOf(b.player[s.sac[j]]);
    if (sum - v >= s.need) { sum -= v; s.sac.splice(j, 1); j--; }

  G.mode = sum >= s.need ? 'place' : 'sacrifice';
  refreshModeUI();
}
async function placeAt(lane) {
  const b = G.b, s = G.sel;

  const sac = s.sac.slice();

async function doAction(fn, info) {

/* ---------- Проигрывание событий боя ---------- */

    else if (G.tut) { await say(LINES.enc.tutorial, { look: true, back: 'table' }); await say(LINES.tut.board); await say(LINES.tut.hand); await say(LINES.tut.meat); }
    else { const line = LINES.enc[node.encounter]; if (line) await say(line + (node.type === 'hard' ? ' ' + LINES.hard : ''), { look: true, back: 'table' }); }
    setModeFromPhase();
    if (G.tut) tutPrompt();
    G.click = battleClick;
    G.input = { kind: 'battle' };
    const result = await new Promise(res => { G.battleResolve = res; });
    G.click = null; G.input = null;
    ui.prompt('');
    for (const s of slotMeshes.player.concat(slotMeshes.enemy, slotMeshes.queue)) s.material.opacity = 0;
    const fin = L.finishBattle(run, b);
    if (b.boss) sfx.tense(false);
    if (result === 'won') {
      sfx.play('win');
      if (G.tut) { await say(LINES.tut.done, { look: true, back: 'table' }); G.meta.tutorialDone = true; run.tutorial = false; saveMeta(); }
      else if (b.boss) {
        snuffCandle(bossCandles[0]); sfx.play('snuff'); await wait(600);
      } else await say(pick(LINES.win), { look: true, back: 'table' });
      if (fin.teeth > 0 && !b.boss) { setTeeth(run.teeth); sfx.play('coin'); if (b.teeth > 0 && !G.meta.teethSeen) { G.meta.teethSeen = true; saveMeta(); await say(LINES.teeth); } }
      setTeeth(run.teeth);
      await wait(400);
      clearCards();
      G.b = null;
      saveRun();
      if (node.type === 'hard') await trophyNode(node);
      return b.boss ? 'victory' : 'win';
    }
    // проигрыш: гаснет свеча
    sfx.play('lose');
    await wait(300);
    const ci = run.candles; // индекс погасшей свечи
    if (candles[ci]) { snuffCandle(candles[ci]); sfx.play('snuff'); }
    cam.shake = 0.1;
    await wait(700);
    clearCards();
    G.b = null;
    saveRun();
    if (fin.dead) return 'dead';
    await say(pick(LINES.lose), { look: true, back: 'table' });
  }
}

/* ---------- Выбор карт на столе ---------- */
function clearPicks() { for (const p of G.picks) { const o = G.objs.get(p.uid); if (o) { G.objs.delete(p.uid); o.dispose(); } if (p.label) scene.remove(p.label.mesh); } G.picks = []; }
function pickCards(cards, opts = {}) {
  clearPicks();
  const n = cards.length;
  const maxCols = opts.cols || 6;
  const rows = Math.max(1, Math.ceil(n / maxCols));
  const cols = Math.ceil(n / rows);
  const s = rows >= 3 ? 0.66 : rows === 2 ? 0.8 : 1;
  const zc = opts.z != null ? opts.z : (rows === 1 ? 0.25 : 0.05);
  cards.forEach((c, i) => {
    const r = Math.floor(i / cols), col = i % cols;
    const inRow = Math.min(cols, n - r * cols);
    const x = (col - (inRow - 1) / 2) * 0.95 * s * (rows === 1 ? 1.25 : 1);
    const z = zc + (r - (rows - 1) / 2) * 1.2 * s;
    const o = spawnCard(c, new V3(0, 0.8, -2.4), FLAT, 'pick');
    o.target(new V3(x, 0.02, z), FLAT, s);
    const enabled = opts.filter ? !!opts.filter(c) : true;
    o.dim = !enabled;
    const p = { uid: c.uid, card: c, enabled, o };
    if (opts.labels && opts.labels[i]) { const lb = makeSlate(0.6, 0.18); lb.set(opts.labels[i]); lb.mesh.rotation.x = -Math.PI / 2; lb.mesh.position.set(x, 0.01, z + 0.62 * s); scene.add(lb.mesh); p.label = lb; }
    G.picks.push(p);
  });
  if (opts.prompt) ui.prompt(opts.prompt);
  sfx.play('paper');
  return new Promise(res => {
    const finish = (v) => { G.click = null; G.input = null; ui.hideChoices(); res(v); };
    G.click = hit => {
      if (!hit || hit.kind !== 'card') return;
      const p = G.picks.find(x => x.uid === hit.uid);
      if (!p) return;
      if (!p.enabled) { deny(opts.disabledText || ''); return; }
      sfx.play('place');
      finish({ card: p.card, index: G.picks.indexOf(p), obj: p.o });
    };
    G.input = {
      kind: 'pick',
      auto: () => {
        const en = G.picks.filter(p => p.enabled);
        if (!en.length) { if (opts.skip) finish(null); return; }
        const best = opts.autoPick ? opts.autoPick(en.map(p => p.card)) : en.reduce((a, p) => L.cardValue(p.card) - L.costValue(p.card) > L.cardValue(a.card) - L.costValue(a.card) ? p : a, en[0]).card;
        const p = en.find(x => x.card === best) || en[0];
        finish({ card: p.card, index: G.picks.indexOf(p), obj: p.o });
      },
    };
    if (opts.skip) ui.choices([{ label: opts.skip, value: '__skip' }]).then(v => { if (v === '__skip') finish(null); });
  });
}
async function choose(opts, autoIndex = 0) {
  G.input = { kind: 'choice', auto: () => { if (G.choiceResolve) G.choiceResolve(opts[Math.min(autoIndex, opts.length - 1)].value); } };
  const v = await ui.choices(opts);
  G.input = null;
  return v;
}

    saveRun();
    const so = G.picks.find(p => p.uid === bpick.card.uid);
    const ao = G.picks.find(p => p.uid === a.card.uid);
    if (so && ao) { so.o.target(ao.o.tp.clone(), FLAT, 0.4); await wait(300); killObj(so.o, 'up'); }
    if (ao) { ao.o.faceKey = null; ao.o.setCard(res.card); ao.o.glow = 0.5; }
    sfx.play('grow');

async function shopNode(node) {
  const run = G.run;
  const o = L.nodeOffer(run, node, G.deathPool); saveRun();
  setView('event');
  setTeeth(run.teeth);
  await say(LINES.shop, { wait: false });
  for (;;) {
    const avail = o.cards.map((it, i) => ({ it, i })).filter(x => o.sold.indexOf('card' + x.i) < 0);
    const itemsAvail = o.items.map((it, i) => ({ it, i })).filter(x => o.sold.indexOf('item' + x.i) < 0);
    showOfferItems(itemsAvail.map(x => x.it.id), itemsAvail.map(x => x.it.price));
    offerItems.forEach(x => { if (x.g.userData.hit) x.g.userData.hit.real = itemsAvail[x.g.userData.hit.idx].i; });
    const pickP = pickCards(avail.map(x => x.it.card), { prompt: 'Зубов: <b>' + run.teeth + '</b>. Нажми на карту или предмет, чтобы купить.', labels: avail.map(x => x.it.price + ' ЗУБ.'), filter: c => { const x = avail.find(y => y.it.card === c); return x && run.teeth >= x.it.price; }, disabledText: LINES.shopPoor, z: 0.55, skip: 'Уйти' });
    // клик по предмету тоже покупка
    const pickClick = G.click;
    let itemBought = null;
    const res = await new Promise(resolve => {
      pickP.then(v => resolve({ card: v }));
      G.click = hit => {
        if (hit && hit.kind === 'offerItem') { itemBought = hit.real; ui.hideChoices(); G.click = null; resolve({ item: hit.real }); return; }
        pickClick(hit);
      };
      const auto = G.input.auto;
      G.input.auto = () => {
        const aff = avail.filter(x => run.teeth >= x.it.price);
        if (aff.length && aff.some(x => L.cardValue(x.it.card) > 5)) auto();
        else if (G.choiceResolve) G.choiceResolve('__skip');
      };
    });
    if (itemBought != null) {
      const r = L.buy(run, node, 'item', itemBought);
      if (!r.ok) { deny(); await say(r.error === 'Не хватает зубов' ? LINES.shopPoor : r.error, { wait: false }); }
      else { sfx.play('coin'); setTeeth(run.teeth); saveRun(); }
      hideOfferItems(); clearPicks();
      continue;
    }
    if (!res.card) break;
    const x = avail[res.card.index];
    const r = L.buy(run, node, 'card', x.i);
    if (!r.ok) { deny(); continue; }
    sfx.play('coin'); setTeeth(run.teeth); saveRun();
    await flyAway(res.card.obj, true);
    hideOfferItems(); clearPicks();
  }
  hideOfferItems(); clearPicks(); ui.prompt('');
}

/* ---------- Карта мира ---------- */
function mapUV(n) { return [0.5 + (n.x - 0.5) * 0.92, 0.5 + (n.y - 0.5) * 0.92]; }
function nodeLocal(n) { const [u, v] = mapUV(n); return new V3((u - 0.5) * MAP_W, 0, (v - 0.5) * MAP_H); }
function renderMap() {
  const run = G.run, cv = mapObj.cv, ctx = cv.getContext('2d'), W = cv.width, H = cv.height;
  ctx.imageSmoothingEnabled = false;
  paperFill(ctx, W, H, run.seed % 997, '#c2b38a');
  ctx.fillStyle = 'rgba(80,60,30,0.25)'; ctx.fillRect(W / 3 | 0, 0, 1, H); ctx.fillRect(2 * W / 3 | 0, 0, 1, H); ctx.fillRect(0, H / 2 | 0, W, 1);
  ctx.fillStyle = PAL.ink; ctx.fillRect(0, 0, W, 2); ctx.fillRect(0, H - 2, W, 2); ctx.fillRect(0, 0, 2, H); ctx.fillRect(W - 2, 0, 2, H);
  drawText(ctx, L.REGIONS[run.region].name.toUpperCase(), 6, 6, PAL.ink);
  const nodes = run.map.nodes;
  const px = n => { const [u, v] = mapUV(n); return [Math.round(u * W), Math.round(v * H)]; };
  // деревья по краям
  const r = seeded(run.seed);
  for (let i = 0; i < 46; i++) {
    const x = r() * W | 0, y = 14 + r() * (H - 20) | 0;
    if (Object.values(nodes).some(n => { const [a, b] = px(n); return Math.abs(a - x) < 14 && Math.abs(b - y) < 12; })) continue;
    ctx.fillStyle = 'rgba(40,32,20,0.55)'; ctx.fillRect(x, y - 3, 1, 1); ctx.fillRect(x - 1, y - 2, 3, 1); ctx.fillRect(x - 2, y - 1, 5, 1); ctx.fillRect(x, y, 1, 2);
  }
  // тропинки
  for (const n of Object.values(nodes)) for (const id of n.next) {
    const m = nodes[id]; const [x1, y1] = px(n), [x2, y2] = px(m);
    const steps = Math.ceil(Math.hypot(x2 - x1, y2 - y1) / 3);
    const walked = run.visited.indexOf(id) >= 0 && (run.visited.indexOf(n.id) >= 0 || n.type === 'start');
    ctx.fillStyle = walked ? PAL.blood : PAL.ink2;
    for (let i = 1; i < steps; i++) { if (i % 2) continue; const k = i / steps; ctx.fillRect(Math.round(x1 + (x2 - x1) * k), Math.round(y1 + (y2 - y1) * k), 1, 1); }
  }
  const next = L.nextNodes(run).map(n => n.id);
  for (const n of Object.values(nodes)) {
    const [x, y] = px(n);
    const icon = NODE_ICONS[n.type] || NODE_ICONS.battle;
    const visited = run.visited.indexOf(n.id) >= 0 || (n.type === 'start');
    ctx.fillStyle = '#c2b38a'; ctx.fillRect(x - 7, y - 7, 15, 15);
    drawIcon(ctx, icon, x - 5, y - 5, visited && n.id !== run.pos ? PAL.paperDark : PAL.ink);
    if (visited && n.id !== run.pos && n.type !== 'start') { ctx.fillStyle = PAL.blood; for (let i = -5; i <= 5; i++) { ctx.fillRect(x + i, y + i, 1, 1); ctx.fillRect(x + i, y - i, 1, 1); } }
    if (next.indexOf(n.id) >= 0) { ctx.strokeStyle = PAL.blood; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(x + 0.5, y + 0.5, 9, 0, 7); ctx.stroke(); }
  }
  mapObj.tex.needsUpdate = true;
}
function nearestMapNode(point, list, maxD = 0.4) {
  if (!G.run) return null;
  const local = mapObj.g.worldToLocal(point.clone());
  let best = null, bd = maxD;
  for (const n of list || Object.values(G.run.map.nodes)) { const d = nodeLocal(n).distanceTo(new V3(local.x, 0, local.z)); if (d < bd) { bd = d; best = n; } }
  return best;
}
async function showMap(show) {
  if (show) {
    mapObj.g.visible = true; sfx.play('paper');
    await tween(450, k => { mapObj.g.scale.set(1, 1, Math.max(0.02, k)); }, ease.out);
  } else {
    sfx.play('paper');
    tip.hide();
    await tween(350, k => { mapObj.g.scale.set(1, 1, Math.max(0.02, 1 - k)); });
    mapObj.g.visible = false;
  }
}
async function mapPhase() {
  const run = G.run;
  renderMap();
  mapObj.pawn.position.copy(nodeLocal(run.map.nodes[run.pos]));
  setItems(run.items, 'myItem'); setTeeth(run.teeth);
  piles.deck.g.visible = piles.meat.g.visible = false;
  clockObj.g.visible = false; bossCandles.forEach(c => { c.g.visible = false; });
  setScale(0);
  setView('map');
  await showMap(true);
  $('btn-deck').hidden = false;
  if (!G.meta.mapSeen) { G.meta.mapSeen = true; saveMeta(); await say(LINES.mapFirst); }
  else say(pick(LINES.mapPick), { wait: false });
  const nexts = L.nextNodes(run);
  ui.prompt('Выбери, куда идти: узлы в <b>красных кругах</b>');
  const id = await new Promise(res => {
    G.click = hit => { if (hit && hit.kind === 'map') { const n = nearestMapNode(hit.point, nexts, 0.5); if (n) { G.click = null; G.input = null; res(n.id); } } };
    G.input = { kind: 'map', auto: () => { G.click = null; G.input = null; res(nexts[Math.floor(Math.random() * nexts.length)].id); } };
  });
  ui.prompt('');
  $('btn-deck').hidden = true; $('deckview').hidden = true;
  const from = mapObj.pawn.position.clone(), to = nodeLocal(run.map.nodes[id]);
  for (let i = 0; i < 3; i++) {
    const a = from.clone().lerp(to, i / 3), bpos = from.clone().lerp(to, (i + 1) / 3);
    sfx.play('step');
    await tween(160, k => { mapObj.pawn.position.lerpVectors(a, bpos, k); mapObj.pawn.position.y = Math.sin(k * Math.PI) * 0.18; });
  }
  L.moveTo(run, id); saveRun();
  renderMap();
  await wait(250);
  await showMap(false);
  return run.map.nodes[id];
}

for (let i = -5; i <= 5; i++) { const c = document.createElement('i'); if (i === 0) c.className = 'mid'; hudBar.appendChild(c); }
let hudKey = '', scaleKey = '';
const scaleLabel = $('scale-label'), tmpScale = new V3();
// надпись держится над весами, куда бы ни смотрела камера
function updateScaleLabel() {
  const b = G.b;
  const show = !!b && $('screen').hidden && (cam.name === 'table' || cam.name === 'event');
  if (!show) { scaleLabel.hidden = true; return; }
  tmpScale.copy(scaleObj.g.position); tmpScale.x += 0.5; tmpScale.y += 0.95;

  if (p.z > 1 || p.x < -1.1 || p.x > 1.1 || p.y < -1.1 || p.y > 1.1) { scaleLabel.hidden = true; return; }
  const r = app.getBoundingClientRect();

  const v = b.scale;

}

  G.run = run;
  resetTable();
  candles.forEach((c, i) => { if (i < run.candles) relightCandle(c); else { c.lit = false; c.flame.visible = false; c.light.intensity = 0; } });
  setItems(run.items, 'myItem'); setTeeth(run.teeth);
  saveRun();
  setView('host');
  if (!run.introDone) {
    if (G.meta.runs === 0 && !G.meta.tutorialDone) { for (const l of LINES.intro) await say(l, { look: true, back: 'host' }); }
    else await say(pick(LINES.introAgain), { look: true, back: 'host' });
    run.introDone = true; saveRun();
  }
  for (;;) {
    let node;
    if (run.pending) node = run.map.nodes[run.pending];
    else node = await mapPhase();
    let res = 'ok';
    if (node.type === 'battle' || node.type === 'hard' || node.type === 'boss') res = await runBattle(node);
    else if (node.type === 'cards') await cardsNode(node);
    else if (node.type === 'backpack') await backpackNode(node);
    else if (node.type === 'fire') await fireNode(node);
    else if (node.type === 'altar') await altarNode(node);
    else if (node.type === 'merge') await mergeNode(node);
    else if (node.type === 'shop') await shopNode(node);
    if (res === 'dead') { await deathSequence(); return; }
    L.completeNode(run, node.id); saveRun();
    if (res === 'victory') { await victorySequence(); return; }
  }
}

/* ---------- Главный цикл отрисовки ---------- */
let lastT = performance.now(), hoverTimer = 0, handLift = 1, hudTick = 0;
const tmpV = new V3();
G.lights = 1;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (t - lastT) / 1000)); lastT = t; NOW = t;
  const time = t / 1000;
  updateTweens();
  // камера
  const k = 1 - Math.exp(-dt * (G.meta.liveCam ? 3.0 : 2.2) * Math.min(SPEED, 10));
  cam.pos.lerp(cam.tPos, k); cam.look.lerp(cam.tLook, k);
  tmpV.copy(cam.pos).sub(cam.look).multiplyScalar(viewScale).add(cam.look);
  const live = !!G.meta.liveCam;
  if (live) {
    tmpV.x += Math.sin(time * 0.5) * 0.03 + pointer.x * 0.07;
    tmpV.y += Math.sin(time * 0.7) * 0.02 + pointer.y * 0.04;
  }
  if (cam.shake > 0) { const sh = cam.shake * (live ? 1 : 0.2); tmpV.x += (Math.random() - 0.5) * sh; tmpV.y += (Math.random() - 0.5) * sh; cam.shake = Math.max(0, cam.shake - dt * 0.6); }
  camera.position.copy(tmpV); camera.lookAt(cam.look);
  const tanV = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  // рука опущена, пока курсор не у нижнего края; поднимается целиком при наведении или выборе карты
  const placing = G.mode === 'place' || G.mode === 'sacrifice' || G.mode === 'itemTarget';
  const overHand = G.hoverUid && G.b && G.b.hand.some(c => c.uid === G.hoverUid);
  const handUp = !placing && (IS_TOUCH || overHand);
  handLift += ((handUp ? 1 : 0) - handLift) * Math.min(1, dt * 16);
  handRoot.position.set(0, -tanV * handDepth + 0.0 + handLift * 0.21, -handDepth);
  handRoot.visible = cam.name !== 'host' && cam.name !== 'map';
  for (const o of G.objs.values()) o.update(dt);
  for (const o of G.fx) o.update(dt);
  // лампа качается
  const sway = G.meta.liveCam ? 1 : 0.2;
  lamp.rotation.z = Math.sin(time * 0.55) * 0.035 * sway; lamp.rotation.x = Math.sin(time * 0.41) * 0.03 * sway;
  bulb.getWorldPosition(spot.position);
  const flick = G.lights * (0.97 + Math.sin(time * 23) * 0.015 + (Math.random() < 0.004 ? -0.4 : 0));
  spot.intensity = 2.3 * flick;
  // свечи
  for (const c of candles.concat(bossCandles)) {
    if (!c.g.visible) continue;
    if (c.lit) { const f = 0.85 + Math.sin(time * 9 + c.phase) * 0.08 + Math.sin(time * 23 + c.phase * 2) * 0.05; c.flame.visible = true; c.flame.scale.set(1, f, 1); c.light.intensity = c.base * f; }
    else { c.flame.scale.multiplyScalar(0.85); if (c.flame.scale.y < 0.05) c.flame.visible = false; c.light.intensity *= 0.85; }
  }
  for (const s of [...smokes]) { s.t += dt; if (s.t < s.delay) continue; const k2 = (s.t - s.delay) / s.d; s.m.position.y += dt * 0.4; s.m.position.x += s.vx * dt; s.m.material.opacity = 0.6 * (1 - k2); s.m.lookAt(camera.position); if (k2 >= 1) { scene.remove(s.m); smokes.splice(smokes.indexOf(s), 1); } }
  // весы
  scaleObj.shown += (scaleObj.value - scaleObj.shown) * Math.min(1, dt * 4);
  const ang = Math.max(-1, Math.min(1, scaleObj.shown / 5)) * 0.42 + Math.sin(time * 1.3) * 0.01;
  scaleObj.beam.rotation.x = ang;
  scaleObj.pans.forEach(p => { p.rotation.x = -ang; });
  // колокольчик
  if (bell.ring > 0) { bell.ring = Math.max(0, bell.ring - dt * 1.6); bell.body.rotation.z = Math.sin(bell.ring * 30) * 0.3 * bell.ring; bell.body.position.y = 0.06 + Math.sin(Math.min(1, bell.ring) * Math.PI) * 0.25; }
  const idleGlow = G.b && G.mode === 'idle' && !G.b.hand.some(c => L.canAfford(G.b, c));
  bell.body.children[0].material.emissive.setScalar(idleGlow ? 0.12 + Math.sin(time * 4) * 0.08 : 0);
  // стопки светятся, когда надо тянуть
  for (const kind of ['deck', 'meat']) piles[kind].top.material.emissiveIntensity = G.mode === 'draw' ? 0.25 + Math.sin(time * 5) * 0.15 : 0.1;
  // предметы
  itemObjs.forEach((o, i) => { if (!o) return; o.g.position.y = o.lift * (0.25 + Math.sin(time * 4) * 0.04); });
  // костёр
  if (props.fire.g.visible) { props.fire.flames.forEach((f, i) => { f.scale.y = 0.8 + Math.sin(time * 11 + i * 2) * 0.25; f.rotation.y = time * (i + 1); }); props.fire.light.intensity = 1.3 + Math.sin(time * 17) * 0.2; }
  // кукушка
  if (clockObj.g.visible) {
    clockObj.pop = Math.max(0, clockObj.pop - dt * 0.8);
    const out = Math.sin(Math.min(1, clockObj.pop) * Math.PI);
    clockObj.bird.position.z = 0.0 + out * 0.3; clockObj.door.rotation.y = -out * 1.6;
    clockObj.hand.rotation.z = -(clockObj.every - clockObj.value) / clockObj.every * Math.PI * 2 + Math.sin(time * 2) * 0.03;
  }
  updateHost(dt, time);
  if ((++hudTick & 7) === 0) updateHud();
  updateScaleLabel();
  hoverTimer -= dt;
  if (hoverTimer <= 0) { hoverTimer = 0.15; if (pointer.has && !IS_TOUCH && !pointer.down) onHover(); }
  postMat.uniforms.time.value = time;
  if (renderer) {
    renderer.setRenderTarget(rt); renderer.render(scene, camera);
    renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  }
}

/* ---------- Отладочные хуки для автотестов ---------- */
let autoSame = { key: '', n: 0 };
function battleAuto() {
  const b = G.b;
  if (!b || G.busy || b.result) return 'busy';
  if (G.sel) cancelSel();
  let a = L.smartAction(b);
  const key = b.turn + JSON.stringify(a);
  if (key === autoSame.key) autoSame.n++; else autoSame = { key, n: 0 };
  if (autoSame.n > 3 && b.phase === 'main') a = { type: 'bell' };
  if (!a) return 'none';
  if (a.type === 'draw') { doDraw(a.source); return 'draw'; }
  if (a.type === 'bell') { ringBell(); return 'bell'; }
  if (a.type === 'item') {
    itemClick(a.idx);
    if (G.mode === 'itemTarget') useItemAt(a.target);
    else if (G.mode === 'itemConfirm') itemClick(a.idx);
    return 'item';
  }
  if (a.type === 'play') {
    handClick(a.hand);
    for (const l of a.sac) if (G.mode === 'sacrifice') toggleSac(l);
    if (G.mode === 'place') placeAt(a.lane);
    else { cancelSel(); ringBell(); }
    return 'play';
  }
  return 'none';
}
window.__game = {
  G, L, scene, camera,
  async debugNode(type) {
    const run = L.newRun({ tutorial: false });
    run.teeth = 20; run.introDone = true;
    run.deck.push(L.makeCard('surok'), L.makeCard('uzh'), L.makeCard('volk'), L.makeCard('filin'));
    G.run = run; resetTable(); setTeeth(run.teeth); setItems(run.items, 'myItem');
    ui.screen(''); $('loading').hidden = true;
    const node = { id: 'dbg', type, layer: 3 };
    const fn = { cards: cardsNode, backpack: backpackNode, fire: fireNode, altar: altarNode, merge: mergeNode, shop: shopNode, trophy: trophyNode }[type];
    await fn(node);
    return 'done';
  },
  debugLayout(view = 'table') {
    setView(view, true); setItems(['serp', 'mak', 'arkan'], 'item'); setPile('deck', 5); setPile('meat', 9); setBones(5); setTeeth(3);
    clockObj.g.visible = true; bossCandles.forEach(c => { c.g.visible = true; relightCandle(c); }); setClock(2, 3); setScale(2);
    const cards = ['volk', 'sova', 'krysa', 'gornostay', 'kvaksha', 'yozh'].map(id => L.makeCard(id));
    cards.forEach((c, i) => { const row = i < 2 ? 'player' : i < 4 ? 'enemy' : 'queue'; spawnCard(c, slotPos(row, i % 4), FLAT, 'debug'); });
    ui.screen(''); $('loading').hidden = true;
  },
  setSpeed(v) { SPEED = v; G.autoDialog = v > 4; },
  state() {
    const b = G.b;
    return {
      mode: G.mode, busy: G.busy, input: G.input && G.input.kind, dialog: talk.waitClick, typing: !!talk.skip, screen: !$('screen').hidden, prompt: $('prompt').textContent,
      run: G.run ? { candles: G.run.candles, teeth: G.run.teeth, pos: G.run.pos, visited: G.run.visited.length, deck: G.run.deck.length, pending: G.run.pending } : null,
      battle: b ? { turn: b.turn, phase: b.phase, scale: b.scale, result: b.result, hand: b.hand.length, enc: b.encounterId, boss: b.boss && b.boss.phase } : null,
      errors: G.errors.slice(),
    };
  },
  autoStep() {
    if (talk.waitClick) { advanceDialog(); return 'dialog'; }
    if (talk.skip) { talk.skip(); return 'typing'; }
    if (G.input && G.input.auto) { const k = G.input.kind; G.input.auto(); return 'auto:' + k; }
    if (G.input && G.input.kind === 'battle') return 'battle:' + battleAuto();
    return 'wait';
  },
  // экранные координаты объекта для «настоящих» кликов мышью в тестах
  screenPos(kind, a, b) {
    let p = null;
    if (kind === 'bell') p = bell.g.getWorldPosition(new V3()).add(new V3(0, 0.3, 0));
    else if (kind === 'pile') p = piles[a].top.getWorldPosition(new V3());
    else if (kind === 'slot') p = slotMeshes[a][b].getWorldPosition(new V3());
    else if (kind === 'hand') { const c = G.b.hand[a]; const o = c && G.objs.get(c.uid); if (o) p = o.g.localToWorld(new V3(0, 0, -0.35)); }
    else if (kind === 'mapnode') { const n = G.run.map.nodes[a]; p = mapObj.g.localToWorld(nodeLocal(n)); }
    else if (kind === 'item') p = itemObjs[a] ? itemObjs[a].g.getWorldPosition(new V3()).add(new V3(0, 0.1, 0)) : null;
    if (!p) return null;
    const v = p.clone().project(camera);
    const r = app.getBoundingClientRect();
    return { x: r.left + (v.x + 1) / 2 * r.width, y: r.top + (1 - v.y) / 2 * r.height };
  },
};

/* ---------- Запуск ---------- */
async function main(hotData) {
  G.meta = Object.assign(G.meta, store.get(KEYS.meta) || {});
  G.deathPool = store.get(KEYS.deaths) || [];
  if (!Array.isArray(G.deathPool)) G.deathPool = [];
  sfx.on = G.meta.sound !== false;
  $('btn-cam').textContent = 'Камера: ' + (G.meta.liveCam ? 'живая' : 'спокойная');
  try { await Promise.race([document.fonts.load('700 40px Handjet'), new Promise(r => setTimeout(r, 2500))]); } catch (e) { /* без шрифта тоже играем */ }
  $('btn-sound').textContent = 'Звук: ' + (sfx.on ? 'да' : 'нет');
  if (!renderer) { $('loading').textContent = 'Браузер не поддерживает WebGL, а без него стол не нарисовать. Попробуй другой браузер.'; return; }
  resize();
  window.addEventListener('resize', resize);
  requestAnimationFrame(frame);
  $('loading').hidden = true;
  ui.fade(0);
  if (hotData && hotData.run && !loadRun()) { const r = L.deserializeRun(hotData.run); if (r) { G.run = r; saveRun(); G.run = null; } }
  for (;;) {
    try {
      let run = await titleScreen();
      if (!run) run = L.newRun({ tutorial: !G.meta.tutorialDone });
      await playRun(run);
    } catch (e) {
      console.error(e); G.errors.push(String(e && e.stack || e));
      ui.screen(''); ui.prompt('');
      await say('Что-то пошло не так. Многоглазый моргнул слишком сильно. Начнём сначала.', { wait: false });
    }
    G.run = null; G.b = null;
  }
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ run: G.run ? L.serializeRun(G.run) : null })); } catch (e) { /* нет — и ладно */ }
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(main);
else main((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
