<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Стол Многоглазого</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Handjet:wght@500;600;700&display=swap">
<style>
/* Одна тёмная картинка: ночь, лампа, кость, кровь. Слой интерфейса — поверх 3D. */
:root {
  --night: #070608;      /* фон */
  --soot: #16130f;       /* панели */
  --wood: #4c4230;       /* рамки */
  --bone: #d9cfab;       /* основной текст */
  --ash: #988a63;        /* второстепенный текст */
  --blood: #c23322;      /* акцент */
  --blood-dark: #5a1414;
  --font: 'Handjet', 'Arial Narrow', 'Courier New', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; background: var(--night); color: var(--bone); overflow: hidden; }
body { font-family: var(--font); -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none; }
#app { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); overflow: hidden; background: var(--night); }
#view { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
.px { image-rendering: pixelated; image-rendering: crisp-edges; }

/* подсказка сверху */
#prompt { position: absolute; left: 10px; top: 10px; max-width: min(44vw, 460px); padding: 6px 12px; text-align: left;
  font-size: clamp(17px, 2.1vw, 23px); line-height: 1.2; color: var(--bone); background: rgba(7, 6, 8, .8); border: 2px solid var(--wood); pointer-events: none; text-wrap: balance; }
#prompt:empty { display: none; }
#prompt b { color: var(--blood); font-weight: 600; }

/* кнопки в углу */
#corner { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; }
.btn { font-family: var(--font); font-weight: 600; font-size: clamp(16px, 1.9vw, 20px); color: var(--bone); background: var(--soot); border: 2px solid var(--wood); padding: 5px 10px; cursor: pointer; letter-spacing: .04em; }
.btn:hover, .btn:focus-visible { border-color: var(--bone); outline: none; }
.btn.red { border-color: var(--blood); }
.btn:disabled { opacity: .45; cursor: default; }

/* реплики Многоглазого */
#app[data-view="table"] #dialog, #app[data-view="event"] #dialog { bottom: auto; top: 15%; width: min(90vw, 620px); }
#dialog { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(94vw, 720px); padding: 10px 16px 12px; background: rgba(9, 8, 8, .9);
  border: 2px solid var(--wood); box-shadow: 0 0 0 2px #000; pointer-events: none; }
#dialog .who { font-size: 15px; font-weight: 700; letter-spacing: .18em; color: var(--blood); margin-bottom: 4px; }
#dialog .text { font-size: clamp(20px, 2.6vw, 27px); font-weight: 600; line-height: 1.25; min-height: 1.35em; }
#dialog .more { position: absolute; right: 10px; bottom: 6px; font-size: 15px; color: var(--ash); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* описание карты */
#tooltip { position: absolute; z-index: 5; width: min(380px, 88vw); padding: 10px 12px; background: rgba(12, 10, 9, .95); border: 2px solid var(--wood); pointer-events: none; font-size: 19px; font-weight: 500; line-height: 1.2; }
#tooltip .row { display: flex; gap: 10px; align-items: flex-start; }
#tooltip canvas, #tooltip img { flex: none; width: 112px; height: 158px; image-rendering: auto; }
#tooltip .info { min-width: 0; }
#tooltip h3 { margin: 0 0 4px; font-size: 26px; font-weight: 700; text-wrap: balance; }
#tooltip .cost { color: var(--ash); font-size: 18px; }
#tooltip .stats { margin: 4px 0; }
#tooltip .sig { display: flex; gap: 6px; margin-top: 6px; align-items: flex-start; }
#tooltip .sig canvas { width: 20px; height: 20px; flex: none; margin-top: 2px; image-rendering: pixelated; }
#tooltip .sig b { color: var(--bone); font-weight: 600; }
#tooltip .sig span { color: var(--ash); }
#tooltip .flavor { margin-top: 8px; color: var(--ash); font-style: italic; }
#tooltip .warn { margin-top: 6px; color: var(--blood); }
#tooltip.small { width: auto; max-width: min(320px, 86vw); }

/* выбор вариантов */
#choices { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: min(94vw, 720px); }
#choices .btn { font-size: clamp(18px, 2.2vw, 22px); padding: 8px 14px; }

/* полноэкранные панели: заставка, справка, итоги */
#screen, #helpview { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(5, 4, 5, .82); z-index: 8; overflow-y: auto; }
#helpview { z-index: 11; }
#screen .panel, #helpview .panel { width: min(640px, 100%); padding: 20px 22px; background: var(--soot); border: 2px solid var(--wood); box-shadow: 0 0 0 3px #000; }
#screen h1 { margin: 0 0 6px; font-size: clamp(28px, 6vw, 48px); font-weight: 600; letter-spacing: .02em; color: var(--bone); text-wrap: balance; }
#screen h2, #helpview h2 { margin: 0 0 10px; font-size: clamp(20px, 4vw, 28px); font-weight: 600; text-wrap: balance; }
#screen p { margin: 8px 0; line-height: 1.3; color: var(--bone); font-size: 21px; font-weight: 500; }
#screen .muted { color: var(--ash); }
#screen .actions, #helpview .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
#helpview .rules { font-size: 20px; line-height: 1.25; }
#helpview .rules li { margin: 4px 0; }
#screen input { font-family: var(--font); font-size: 26px; background: var(--night); color: var(--bone); border: 2px solid var(--wood); padding: 6px 8px; width: 100%; box-sizing: border-box; }
#screen input:focus { outline: none; border-color: var(--blood); }
#screen .deathcard { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
#screen .deathcard canvas { width: 128px; height: 180px; flex: none; }
#screen .tag { color: var(--blood); }
.eye { display: inline-block; width: .7em; height: .7em; border-radius: 50%; background: var(--bone); box-shadow: inset 0 0 0 .18em var(--blood); vertical-align: middle; }

/* колода */
#deckview { position: absolute; inset: 0; z-index: 7; background: rgba(5, 4, 5, .9); display: flex; flex-direction: column; padding: 16px; box-sizing: border-box; }
#deckview .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
#deckview .grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; padding-top: 12px; align-content: start; }
#deckview .grid canvas { width: 100%; height: auto; cursor: help; }

/* всплывающие числа урона */
.float { position: absolute; font-size: clamp(26px, 3.6vw, 40px); font-weight: 700; color: var(--blood); text-shadow: 2px 2px 0 #000; pointer-events: none; transform: translate(-50%, -50%); white-space: nowrap; z-index: 4; }
.float.good { color: var(--bone); }

#flash { position: absolute; inset: 0; pointer-events: none; background: var(--blood); opacity: 0; mix-blend-mode: multiply; z-index: 3; }
#fade { position: absolute; inset: 0; pointer-events: none; background: #000; opacity: 1; transition: opacity .8s; z-index: 9; }
#loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--ash); z-index: 10; text-align: center; padding: 16px; }
#rotate { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px); padding: 6px 10px; font-size: 13px; color: var(--ash); background: rgba(7, 6, 8, .8); border: 1px solid var(--wood); pointer-events: none; text-align: center; }
/* панель с главными числами: всё важное — крупно и без 3D */
#hud { position: absolute; left: 10px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; min-width: 230px;
  background: rgba(7, 6, 8, .82); border: 2px solid var(--wood); pointer-events: none; font-weight: 600; z-index: 2; }
#hud .row { display: flex; justify-content: space-between; gap: 14px; font-size: clamp(19px, 2.2vw, 24px); line-height: 1.1; }
#hud .row b { font-size: 1.25em; font-weight: 700; color: var(--bone); font-variant-numeric: tabular-nums; }
#hud .lbl { color: var(--ash); }
#hud .scale-title { display: flex; justify-content: space-between; font-size: clamp(19px, 2.2vw, 24px); }
#hud .bar { display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; margin: 4px 0 2px; }
#hud .bar i { height: 16px; background: #221d18; border: 1px solid #3a3126; }
#hud .bar i.mid { background: #4c4230; }
#hud .bar i.me { background: var(--bone); }
#hud .bar i.him { background: var(--blood); }
#hud .bar-legend { display: flex; justify-content: space-between; font-size: 15px; color: var(--ash); }
#hud .note { font-size: clamp(16px, 1.9vw, 20px); color: var(--bone); }
#hud .note.bad { color: var(--blood); }
@media (max-height: 460px) { #hud { min-width: 190px; padding: 6px 8px; gap: 3px; } #hud .row, #hud .scale-title { font-size: 16px; } #hud .bar i { height: 11px; } }
/* крупная надпись над весами */
#scale-label { position: absolute; z-index: 2; transform: translate(0, -50%); pointer-events: none; text-align: center; padding: 4px 12px 6px;
  background: rgba(7, 6, 8, .84); border: 2px solid var(--wood); white-space: nowrap; transition: border-color .2s; }
#scale-label .v { font-size: clamp(34px, 4.4vw, 56px); font-weight: 700; line-height: 1; color: var(--bone); font-variant-numeric: tabular-nums; }
#scale-label .s { font-size: clamp(16px, 1.8vw, 21px); font-weight: 600; color: var(--ash); line-height: 1.1; }
#scale-label.him { border-color: var(--blood); }
#scale-label.him .v { color: var(--blood); }
#scale-label.me .v { color: var(--bone); }
#scale-label.pulse { animation: pulse .45s ease-out; }
@keyframes pulse { 0% { transform: translate(0, -50%) scale(1.2); } 100% { transform: translate(0, -50%) scale(1); } }
[hidden] { display: none !important; }
@media (max-width: 600px), (max-height: 460px) { #tooltip { font-size: 16px; padding: 7px 9px; width: min(300px, 82vw); } #tooltip canvas, #tooltip img { width: 64px; height: 90px; } #tooltip h3 { font-size: 20px; } #tooltip .flavor { display: none; } }
@media (prefers-reduced-motion: reduce) { #dialog .more { animation: none; } }
@media (max-width: 600px) { #corner .btn { padding: 4px 7px; } #prompt { top: 46px; max-width: calc(100vw - 20px); } }
</style>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>
  <div id="prompt"></div>
  <div id="corner">
    <button class="btn" id="btn-deck" hidden>Колода</button>
    <button class="btn" id="btn-help">Правила</button>
    <button class="btn" id="btn-cam">Камера: спокойная</button>
    <button class="btn" id="btn-sound">Звук: да</button>
  </div>
  <div id="tooltip" hidden></div>
  <div id="choices" hidden></div>
  <div id="dialog" hidden><div class="who">МНОГОГЛАЗЫЙ</div><div class="text"></div><div class="more">▼</div></div>
  <div id="deckview" hidden></div>
  <div id="screen" hidden></div>
  <div id="helpview" hidden></div>
  <div id="flash"></div>
  <div id="fade"></div>
  <div id="scale-label" hidden><div class="v">0</div><div class="s">равновесие</div></div>
  <div id="hud" hidden>
    <div id="hud-scale">
      <div class="scale-title"><span class="lbl">Весы</span><b id="hud-scale-val">0</b></div>
      <div class="bar" id="hud-bar"></div>
      <div class="bar-legend"><span>его победа</span><span>твоя победа</span></div>
      <div class="note" id="hud-note"></div>
    </div>
    <div class="row" id="hud-clock"><span class="lbl">Кукушка через</span><b id="hud-clock-val">3</b></div>
    <div class="row"><span class="lbl">Свечи</span><b id="hud-candles">2 из 2</b></div>
    <div class="row" id="hud-bones-row"><span class="lbl">Кости</span><b id="hud-bones">0</b></div>
    <div class="row"><span class="lbl">Зубы</span><b id="hud-teeth">0</b></div>
  </div>
  <div id="rotate" hidden>Поверни телефон горизонтально — так стол виден целиком</div>
  <div id="loading">Многоглазый зажигает лампу…</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script id="game-logic">
/* =====================================================================
   ЛОГИКА ИГРЫ. Никакого DOM и Three.js: только данные и правила.
   Всё, что ниже, можно запускать в Node (см. tests/sim.mjs).
   Наружу отдаётся один объект: GameLogic.
   ===================================================================== */
(function (root) {
'use strict';

const LANES = 4;
const WIN_AT = 5;            // перевес весов для победы
const MEAT_PER_BATTLE = 10;  // полёвок в отдельной стопке
const PATIENCE_TURN = 18;    // с этого хода Многоглазый давит на весы (бой не может длиться вечно)
const MAX_SIGILS = 3;
const SAVE_VERSION = 1;

/* ---------- Случайность с сохраняемым состоянием ---------- */
function makeRng(seed) {
  let s = (seed >>> 0) || 0x9e3779b9;
  const r = function () {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  r.int = n => Math.floor(r() * n);
  r.pick = a => a[Math.floor(r() * a.length)];
  r.chance = p => r() < p;
  r.shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  r.weighted = (items, wf) => { let tot = 0; for (const it of items) tot += wf(it); let x = r() * tot; for (const it of items) { x -= wf(it); if (x <= 0) return it; } return items[items.length - 1]; };
  r.getState = () => s;
  return r;
}

/* ---------- Сигилы ---------- */
const SIGILS = {
  flying:     { name: 'Крылья',           desc: 'Перелетает карту напротив и бьёт прямо по весам. Перехватить может только «Высокий прыжок».' },
  reach:      { name: 'Высокий прыжок',   desc: 'Подпрыгивает и ловит летунов, которые атакуют эту линию.' },
  deathtouch: { name: 'Яд',               desc: 'Любое существо, которое ранит эта карта, погибает.' },
  split:      { name: 'Развилка',         desc: 'Бьёт не прямо, а сразу в две соседние линии: левее и правее.' },
  spikes:     { name: 'Колючки',          desc: 'Кто ударит эту карту, сам получит 1 урон.' },
  runner:     { name: 'Бегун',            desc: 'В конце своего хода перебегает на соседнюю свободную линию по стрелке.' },
  undying:    { name: 'Неубиваемый',      desc: 'Погибнув или став жертвой, возвращается в руку.' },
  worthy:     { name: 'Достойная жертва', desc: 'В жертву идёт за троих: даёт 3 крови вместо 1.' },
  grows:      { name: 'Растёт',           desc: 'Если переживёт один ход, превращается во взрослую форму.' },
  leader:     { name: 'Вожак',            desc: 'Соседи слева и справа получают +1 к атаке.' },
};

/* ---------- Карты ----------
   tier: meat | common | uncommon | rare | evolved | enemy | boss
   blood — цена в крови, bones — цена в костях. evolve — во что растёт. */
const CARDS = {
  // мясо для жертв
  polevka:    { name: 'Полёвка',      tier: 'meat', atk: 0, hp: 1, flavor: 'Маленькая, тёплая и обречённая. Как надежда в финале сезона.' },
  // обычные
  gornostay:  { name: 'Горностай',    tier: 'common', blood: 1, atk: 1, hp: 2, flavor: 'Белый воротничок. Работает за еду и за тебя.' },
  kvaksha:    { name: 'Квакша',       tier: 'common', blood: 1, atk: 1, hp: 2, sigils: ['reach'], flavor: 'Прыгает выше головы. Своей и чужой.' },
  vorobey:    { name: 'Воробей',      tier: 'common', blood: 1, atk: 1, hp: 1, sigils: ['flying'], flavor: 'Слово — не воробей. А этот — воробей.' },
  yozh:       { name: 'Ёж',           tier: 'common', blood: 1, atk: 1, hp: 2, sigils: ['spikes'], flavor: 'Из тумана вышел. Обратно не собирается.' },
  zayats:     { name: 'Заяц',         tier: 'common', blood: 1, atk: 2, hp: 1, sigils: ['runner'], flavor: 'Нигде не задерживается. Даже в жизни.' },
  lisyonok:   { name: 'Лисёнок',      tier: 'common', blood: 1, atk: 1, hp: 1, sigils: ['grows'], evolve: 'lis', flavor: 'Дай ему ход — и он тебя удивит.' },
  volk:       { name: 'Волк',         tier: 'common', blood: 2, atk: 3, hp: 2, flavor: 'Классика. Зубы, шерсть, никаких сюрпризов.' },
  sova:       { name: 'Сова',         tier: 'common', blood: 2, atk: 2, hp: 2, sigils: ['flying'], flavor: 'Не то, чем кажется. Но в этот раз — именно сова.' },
  gadyuka:    { name: 'Гадюка',       tier: 'common', blood: 2, atk: 1, hp: 1, sigils: ['deathtouch'], flavor: 'Один укус — и в сценарии меняется актёрский состав.' },

  gusenitsa:  { name: 'Гусеница',     tier: 'common', bones: 3, atk: 0, hp: 2, sigils: ['grows'], evolve: 'motylek', flavor: 'Терпение. Скоро будет красиво.' },

  surok:      { name: 'Сурок',        tier: 'uncommon', blood: 1, atk: 0, hp: 1, sigils: ['worthy'], flavor: 'Жирненький. Стоит троих. Он об этом не знает.' },

  // взрослые формы (не выпадают сами)
  lis:        { name: 'Лис',          tier: 'evolved', blood: 1, atk: 3, hp: 2, flavor: 'Вырос. Хитрость прилагается.' },

  // только у противника
  pen:        { name: 'Пень',         tier: 'enemy', atk: 0, hp: 3, flavor: 'Просто пень. Мешает.' },

/* ---------- Экземпляры карт ---------- */
let UID = 1;
function newUid() { return 'c' + (UID++); }

function makeCard(id, extra) {
  const d = CARDS[id];
  if (!d) throw new Error('Нет карты ' + id);
  const c = { uid: newUid(), id, name: d.name, blood: d.blood, bones: d.bones, atk: d.atk, hp: d.hp, sigils: d.sigils.slice(), evolve: d.evolve, art: id, buffAtk: 0, buffHp: 0, fused: false, death: null };
  if (extra) Object.assign(c, extra);
  return c;
}
function cloneCard(c) { return JSON.parse(JSON.stringify(c)); }
function has(c, s) { return !!c && c.sigils.indexOf(s) >= 0; }
function cardTier(c) { return c.death ? 'death' : (CARDS[c.id] ? CARDS[c.id].tier : 'common'); }

// Боевой экземпляр: копия с текущим здоровьем.
function battleCard(src, owner) {
  return {
    uid: newUid(), id: src.id, src: src.uid || null, name: src.name, blood: src.blood, bones: src.bones,
    atk: src.atk, hp: src.hp, maxHp: src.hp, sigils: src.sigils.slice(), evolve: src.evolve || null, art: src.art || src.id,
    buffAtk: src.buffAtk || 0, buffHp: src.buffHp || 0, fused: !!src.fused, death: src.death || null, owner, age: 0, dir: 1,
  };
}
function snap(c) {
  return { uid: c.uid, id: c.id, name: c.name, blood: c.blood, bones: c.bones, atk: c.atk, hp: c.hp, maxHp: c.maxHp, sigils: c.sigils.slice(), art: c.art, fused: c.fused, death: c.death, dir: c.dir, evolve: c.evolve };
}

/* Ценность карты — нужна ИИ противника, боту и раскладке наград. */
function cardValue(c) {
  if (!c) return 0;
  let v = c.atk * 2.2 + c.hp * 1.1;
  for (const s of c.sigils) v += { flying: 1.4 * c.atk + 0.5, reach: 0.8, deathtouch: 3, split: 1.2 * c.atk, spikes: 1, runner: 0, undying: 2, worthy: 3, grows: 2.5, leader: 2 }[s] || 0;
  return v;
}
function costValue(c) { return c.blood * 2.2 + c.bones * 0.7; }

/* =====================================================================
   БОЙ
   ===================================================================== */
function emit(b, e) { b.events.push(e); }
function takeEvents(b) { const e = b.events; b.events = []; return e; }
function other(side) { return side === 'player' ? 'enemy' : 'player'; }

function meatCard() { return battleCard(makeCard('polevka'), 'player'); }

function enemyCard(id) { const c = battleCard(makeCard(id), 'enemy'); return c; }

function parseSpec(spec) {
  const m = /^([a-z_]+)(?:@(\d))?(>)?$/.exec(spec);
  return { id: m[1], lane: m[2] != null ? +m[2] : null, queue: !!m[3] };
}

function createBattle(opts) {
  const rng = makeRng(opts.seed || 1);
  const b = {
    rng, player: [null, null, null, null], enemy: [null, null, null, null], queue: [null, null, null, null],
    hand: [], deck: [], meat: MEAT_PER_BATTLE, bones: 0, scale: 0, turn: 1, phase: 'main', result: null, teeth: 0,
    items: (opts.items || []).slice(), usedItems: [], skipEnemy: false, pendingEnemy: [], enemyTurnIdx: 0,
    encounterId: opts.encounter, encounter: ENCOUNTERS[opts.encounter], boss: null, events: [], tutorial: !!opts.tutorial,
    kind: opts.kind || 'battle', stats: { dealt: 0, taken: 0, sacrificed: 0, lost: 0, killed: 0 },
  };
  while (b.items.length < 3) b.items.push(null);
  if (opts.boss) {
    const B = BOSSES[opts.boss];
    b.boss = { id: opts.boss, phase: 1, candles: 2, every: B.phases[0].clockEvery, clock: B.phases[0].clockEvery, rotate: B.phases[0].rotate };
    b.encounterId = B.phases[0].encounter; b.encounter = ENCOUNTERS[b.encounterId];
  }
  if (!b.encounter) throw new Error('Нет боя ' + b.encounterId);
  b.deck = (opts.deck || []).map(c => battleCard(c, 'player'));
  if (!opts.fixedOrder) rng.shuffle(b.deck);
  // Стартовая рука: 3 из колоды (хотя бы одна дешёвая, если такая есть) + полёвка.
  const cheap = c => c.blood <= 1 && c.bones === 0;
  if (!opts.fixedOrder && b.deck.length > 3 && !b.deck.slice(0, 3).some(cheap)) {
    const j = b.deck.findIndex(cheap);
    if (j > 0) { const t = b.deck[j]; b.deck[j] = b.deck[2]; b.deck[2] = t; }
  }
  for (let i = 0; i < 3 && b.deck.length; i++) b.hand.push(b.deck.shift());
  b.hand.push(meatCard()); b.meat--;
  placeStart(b, b.encounter.start);
  emit(b, { t: 'start' });
  return b;
}

function placeStart(b, list) {
  for (const spec of list || []) {
    const s = parseSpec(spec);
    const c = enemyCard(s.id);
    const row = s.queue ? b.queue : b.enemy;
    let lane = s.lane;
    if (lane == null || row[lane]) lane = row.findIndex(x => !x);
    if (lane < 0) continue;
    row[lane] = c;
    emit(b, { t: s.queue ? 'queue' : 'place', side: 'enemy', lane, card: snap(c) });
  }
}

function effAtk(b, side, lane) {
  const row = b[side];
  const c = row[lane];
  if (!c) return 0;
  let a = c.atk;
  if (lane > 0 && has(row[lane - 1], 'leader')) a += 1;
  if (lane < LANES - 1 && has(row[lane + 1], 'leader')) a += 1;
  return Math.max(0, a);
}
function bloodOf(c) { return has(c, 'worthy') ? 3 : 1; }
function totalBlood(b) { let s = 0; for (const c of b.player) if (c) s += bloodOf(c); return s; }
function canAfford(b, c) {
  if (c.bones > b.bones) return false;
  if (c.blood > 0) return totalBlood(b) >= c.blood;
  return b.player.some(x => !x);
}

function shiftScale(b, d, why) {
  if (!d) return;
  b.scale += d;
  if (d > 0) b.stats.dealt += d; else b.stats.taken -= d;
  emit(b, { t: 'scale', value: b.scale, delta: d, why: why || 'hit' });
}

function damageCard(b, side, lane, dmg, opts) {
  const c = b[side][lane];
  if (!c || dmg <= 0) return;
  c.hp -= dmg;
  emit(b, { t: 'damage', side, lane, uid: c.uid, dmg, hp: Math.max(0, c.hp), cause: opts.cause || 'attack' });
  if (c.hp <= 0) killCard(b, side, lane, opts.cause || 'combat');
  else if (opts.deathtouch) killCard(b, side, lane, 'poison');
}

function killCard(b, side, lane, cause) {
  const c = b[side][lane];
  if (!c) return;
  b[side][lane] = null;
  emit(b, { t: 'die', side, lane, uid: c.uid, cause, id: c.id });
  if (side === 'player') {
    b.bones += 1; b.stats.lost += cause === 'sacrifice' ? 0 : 1;
    emit(b, { t: 'bones', n: b.bones, delta: 1, lane });
  } else b.stats.killed++;
  if (has(c, 'undying')) {
    if (side === 'player') {
      const base = makeCard(c.id, { name: c.name, blood: c.blood, bones: c.bones, atk: c.atk - 0, hp: c.maxHp, sigils: c.sigils.slice(), art: c.art, fused: c.fused, death: c.death, evolve: c.evolve });
      const nc = battleCard(base, 'player');
      b.hand.push(nc);
      emit(b, { t: 'toHand', uid: nc.uid, from: c.uid, card: snap(nc) });
    } else if (!b.queue[lane]) {
      const nc = enemyCard(c.id);
      b.queue[lane] = nc;
      emit(b, { t: 'queue', side: 'enemy', lane, card: snap(nc) });
    }
  }
}

function strike(b, side, lane, t, p) {
  const atkr = b[side][lane];
  const foe = other(side);
  const def = b[foe][t];
  const fly = has(atkr, 'flying');
  if (!def || (fly && !has(def, 'reach'))) {
    emit(b, { t: 'attack', side, lane, target: t, uid: atkr.uid, direct: true, dmg: p, over: !!def });
    shiftScale(b, side === 'player' ? p : -p, 'hit');
    return;
  }
  emit(b, { t: 'attack', side, lane, target: t, uid: atkr.uid, direct: false, dmg: p, caught: fly });
  const spiky = has(def, 'spikes');
  damageCard(b, foe, t, p, { deathtouch: has(atkr, 'deathtouch'), cause: 'attack' });
  if (spiky && b[side][lane] === atkr) damageCard(b, side, lane, 1, { cause: 'spikes' });
}

function attackPhase(b, side) {
  for (let lane = 0; lane < LANES; lane++) {
    const atkr = b[side][lane];
    if (!atkr) continue;
    const targets = has(atkr, 'split') ? [lane - 1, lane + 1].filter(l => l >= 0 && l < LANES) : [lane];
    for (const t of targets) {
      if (b[side][lane] !== atkr) break;
      const p = effAtk(b, side, lane);
      if (p <= 0) break;
      strike(b, side, lane, t, p);
    }
  }
}

function moveRunners(b, side) {
  const row = b[side];
  const runners = row.filter(c => has(c, 'runner'));
  for (const c of runners) {
    const lane = row.indexOf(c);
    if (lane < 0) continue;
    let to = lane + c.dir;
    if (to < 0 || to >= LANES || row[to]) {
      c.dir = -c.dir;
      to = lane + c.dir;
      if (to < 0 || to >= LANES || row[to]) continue;
    }
    row[lane] = null; row[to] = c;
    emit(b, { t: 'move', side, from: lane, to, uid: c.uid, dir: c.dir });
  }
}

function evolveCard(c) {
  const e = CARDS[c.evolve];
  if (!e) return;
  const base = CARDS[c.id];
  const extra = c.sigils.filter(s => s !== 'grows' && !(base && base.sigils.indexOf(s) >= 0));
  c.id = e.id; c.name = e.name; c.art = e.id;
  c.atk = e.atk + (c.buffAtk || 0);
  c.maxHp = e.hp + (c.buffHp || 0); c.hp = c.maxHp;
  const sig = e.sigils.slice();
  for (const s of extra) if (sig.indexOf(s) < 0 && sig.length < MAX_SIGILS) sig.push(s);
  c.sigils = sig; c.evolve = e.evolve;
}

function growSide(b, side) {
  b[side].forEach((c, lane) => {
    if (!c) return;
    c.age++;
    if (has(c, 'grows') && c.age >= 1 && c.evolve) {
      evolveCard(c);
      emit(b, { t: 'evolve', side, lane, uid: c.uid, card: snap(c) });
    }
  });
}

/* --- ИИ противника: куда положить карту в задний ряд --- */
function pickQueueLane(b, id) {
  const d = CARDS[id];
  let best = null, bestScore = -1e9;
  for (let lane = 0; lane < LANES; lane++) {
    if (b.queue[lane]) continue;
    const opp = b.player[lane];
    let s = b.rng() * 1.5;
    if (!b.enemy[lane]) s += 3;
    if (d.atk > 0) {
      if (!opp) s += 2;
      else if (opp.hp <= d.atk) s += 1.5;
      if (d.sigils.indexOf('flying') >= 0 && opp && !has(opp, 'reach')) s += 1.5;
    }
    if ((d.atk === 0 || d.hp >= 4) && opp && opp.atk > 0) s += 2;
    if (s > bestScore) { bestScore = s; best = lane; }
  }
  return best;
}

function nextEnemyPlan(b) {
  const enc = b.encounter;
  const i = b.enemyTurnIdx++;
  if (i < enc.turns.length) return enc.turns[i].map(parseSpec);
  if (enc.then) {
    const k = i - enc.turns.length;
    if (k % enc.then.every === enc.then.every - 1) return [parseSpec(b.rng.pick(enc.then.pool))];
  }
  return [];
}

function enemyQueue(b) {
  const list = b.pendingEnemy.concat(nextEnemyPlan(b));
  b.pendingEnemy = [];
  for (const it of list) {
    let lane = it.lane;
    if (lane == null || b.queue[lane]) lane = pickQueueLane(b, it.id);
    if (lane == null) { if (b.pendingEnemy.length < 4) b.pendingEnemy.push(it); continue; }
    const c = enemyCard(it.id);
    b.queue[lane] = c;
    emit(b, { t: 'queue', side: 'enemy', lane, card: snap(c) });
  }
}

function resolveScale(b) {
  if (b.result) return b.result;
  if (b.scale >= WIN_AT) {
    const over = b.scale - WIN_AT;
    b.teeth += over;
    if (b.boss && b.boss.candles > 1) { bossTransition(b, over); return 'transition'; }
    b.result = 'won'; b.phase = 'over';
    emit(b, { t: 'win', teeth: over });
    return 'won';
  }
  if (b.scale <= -WIN_AT) {
    b.result = 'lost'; b.phase = 'over';
    emit(b, { t: 'lose' });
    return 'lost';
  }
  return null;
}

function bossTransition(b, over) {
  const B = BOSSES[b.boss.id];
  b.boss.candles--; b.boss.phase++;
  const ph = B.phases[b.boss.phase - 1];
  emit(b, { t: 'bossPhase', phase: b.boss.phase, teeth: over });
  for (const row of ['enemy', 'queue']) {
    b[row].forEach((c, lane) => { if (c) { b[row][lane] = null; emit(b, { t: 'vanish', row, lane, uid: c.uid }); } });
  }
  b.scale = 0;
  emit(b, { t: 'scale', value: 0, delta: 0, why: 'reset' });
  b.encounterId = ph.encounter; b.encounter = ENCOUNTERS[ph.encounter];
  b.enemyTurnIdx = 0; b.pendingEnemy = [];
  b.boss.every = ph.clockEvery; b.boss.clock = ph.clockEvery; b.boss.rotate = ph.rotate;
  emit(b, { t: 'clock', value: b.boss.clock, every: b.boss.every });
  placeStart(b, b.encounter.start);
}

function bossEndOfTurn(b) {
  if (!b.boss) return;
  if (b.boss.rotate) {
    const old = b.enemy.slice();
    const moved = [];
    for (let i = 0; i < LANES; i++) if (old[i]) moved.push({ from: i, to: (i + 1) % LANES, uid: old[i].uid });
    if (moved.length) {
      for (let i = 0; i < LANES; i++) b.enemy[(i + 1) % LANES] = old[i];
      emit(b, { t: 'rotate', moves: moved });
    }
  }
  b.boss.clock--;
  if (b.boss.clock <= 0) {
    b.boss.clock = b.boss.every;
    emit(b, { t: 'cuckoo', value: b.boss.clock, every: b.boss.every });
    shiftScale(b, -1, 'cuckoo');
  } else emit(b, { t: 'clock', value: b.boss.clock, every: b.boss.every });
}

function enemyTurn(b) {
  b.phase = 'enemy';
  emit(b, { t: 'enemyTurn' });
  growSide(b, 'enemy');
  for (let lane = 0; lane < LANES; lane++) {
    if (b.queue[lane] && !b.enemy[lane]) {
      const c = b.queue[lane];
      b.enemy[lane] = c; b.queue[lane] = null;
      emit(b, { t: 'advance', lane, uid: c.uid });
    }
  }
  attackPhase(b, 'enemy');
  if (resolveScale(b)) return;
  moveRunners(b, 'enemy');
  bossEndOfTurn(b);
  if (resolveScale(b)) return;
  if (b.turn >= PATIENCE_TURN) {
    emit(b, { t: 'patience' });
    shiftScale(b, -1, 'patience');
    if (resolveScale(b)) return;
  }
  enemyQueue(b);
}

function startPlayerTurn(b) {
  b.turn++;
  growSide(b, 'player');
  b.phase = (b.deck.length || b.meat > 0) ? 'draw' : 'main';
  emit(b, { t: 'turn', turn: b.turn, phase: b.phase });
}

/* --- Действия игрока. Каждое возвращает { ok, error?, events } --- */
function fail(msg) { return { ok: false, error: msg, events: [] }; }
function done(b) { return { ok: true, events: takeEvents(b) }; }

function draw(b, source) {
  if (b.phase !== 'draw') return fail('Сейчас не время тянуть карту');
  let c;
  if (source === 'deck') { if (!b.deck.length) return fail('Колода пуста'); c = b.deck.shift(); }
  else if (source === 'meat') { if (b.meat <= 0) return fail('Полёвки кончились'); c = meatCard(); b.meat--; }
  else return fail('Непонятно, откуда тянуть');
  b.hand.push(c);
  emit(b, { t: 'draw', from: source, uid: c.uid, card: snap(c) });
  b.phase = 'main';
  emit(b, { t: 'phase', phase: 'main' });
  return done(b);
}

function validSacrifice(b, card, sac) {
  if (card.blood === 0) return sac.length === 0;
  const uniq = new Set(sac);
  if (uniq.size !== sac.length) return false;
  let sum = 0, min = 99;
  for (const l of sac) { const c = b.player[l]; if (!c) return false; const v = bloodOf(c); sum += v; min = Math.min(min, v); }
  return sum >= card.blood && sum - min < card.blood;
}

function play(b, handIdx, lane, sac) {
  sac = sac || [];
  if (b.phase !== 'main') return fail('Сейчас нельзя играть карты');
  const card = b.hand[handIdx];
  if (!card) return fail('Нет такой карты');
  if (card.bones > b.bones) return fail('Не хватает костей');
  if (!validSacrifice(b, card, sac)) return fail('Нужно принести в жертву ' + card.blood);
  if (lane < 0 || lane >= LANES) return fail('Нет такой линии');
  if (b.player[lane] && sac.indexOf(lane) < 0) return fail('Линия занята');
  b.hand.splice(handIdx, 1);
  if (card.bones) { b.bones -= card.bones; emit(b, { t: 'bones', n: b.bones, delta: -card.bones }); }
  for (const l of sac) {
    const v = b.player[l];
    b.stats.sacrificed++;
    emit(b, { t: 'sacrifice', lane: l, uid: v.uid, id: v.id });
    killCard(b, 'player', l, 'sacrifice');
  }
  card.age = 0;
  b.player[lane] = card;
  emit(b, { t: 'place', side: 'player', lane, card: snap(card), uid: card.uid });
  return done(b);
}

function itemTargets(b, id) {
  const it = ITEMS[id];
  if (!it || !it.target) return null;
  const out = [];
  for (let l = 0; l < LANES; l++) {
    if (!b.enemy[l]) continue;
    if (it.target === 'enemySteal' && b.player[l]) continue;
    out.push(l);
  }
  return out;
}

function useItem(b, idx, target) {
  if (b.phase !== 'main') return fail('Сейчас нельзя');
  const id = b.items[idx];
  if (!id) return fail('Пустой слот');
  const it = ITEMS[id];
  if (it.target) {
    const ok = itemTargets(b, id);
    if (ok.indexOf(target) < 0) return fail('Сюда нельзя');
  }
  b.items[idx] = null; b.usedItems.push(id);
  emit(b, { t: 'item', id, slot: idx, lane: target });
  if (id === 'serp') killCard(b, 'enemy', target, 'item');
  else if (id === 'gvozd') shiftScale(b, 1, 'pain');
  else if (id === 'mak') { b.skipEnemy = true; emit(b, { t: 'sleep' }); }
  else if (id === 'arkan') {
    const c = b.enemy[target];
    b.enemy[target] = null; c.owner = 'player'; c.age = 0; b.player[target] = c;
    emit(b, { t: 'steal', lane: target, uid: c.uid, card: snap(c) });
  } else if (id === 'banka') {
    const c = meatCard(); b.hand.push(c);
    emit(b, { t: 'draw', from: 'item', uid: c.uid, card: snap(c) });
  } else if (id === 'meshok') { b.bones += 3; emit(b, { t: 'bones', n: b.bones, delta: 3 }); }
  resolveScale(b);
  return done(b);
}

function ringBell(b) {
  if (b.phase !== 'main') return fail('Сначала доделай ход');
  b.phase = 'combat';
  emit(b, { t: 'bell' });
  attackPhase(b, 'player');
  const r = resolveScale(b);
  if (r === 'won' || r === 'lost') return done(b);
  if (r === 'transition') { startPlayerTurn(b); return done(b); }
  moveRunners(b, 'player');
  if (b.skipEnemy) { b.skipEnemy = false; emit(b, { t: 'enemySkip' }); }
  else { enemyTurn(b); if (b.result) return done(b); }
  startPlayerTurn(b);
  return done(b);
}

/* Подсказки для интерфейса */
function playableHand(b) { return b.hand.map(c => b.phase === 'main' && canAfford(b, c)); }

/* =====================================================================
   БОТ (для тестов и проверки баланса). Играет «как средний новичок».
   ===================================================================== */
function laneScore(b, card, lane) {
  const opp = b.enemy[lane], q = b.queue[lane];
  const atk = card.atk;
  let s = 0;
  const fly = has(card, 'flying');
  if (atk > 0) {
    if (!opp || (fly && !has(opp, 'reach'))) s += atk * 1.6;
    else if (opp.hp <= atk || has(card, 'deathtouch')) s += 2 + cardValue(opp) * 0.2;
    else s += 0.6;
    if (has(card, 'split')) s += 1;
  }
  const threat = opp ? effAtk(b, 'enemy', lane) : (q ? q.atk : 0);
  if (threat > 0) s += Math.min(threat, 3) * (card.hp > threat ? 1.4 : 0.9);
  if (has(card, 'reach') && ((opp && has(opp, 'flying')) || (q && has(q, 'flying')))) s += 2;
  if (opp && has(opp, 'spikes') && atk > 0) s -= 0.8;
  return s;
}

function botChooseSacrifices(b, card, keepLane) {
  const cands = [];
  b.player.forEach((c, l) => { if (c) cands.push({ l, c, v: cardValue(c) / bloodOf(c) + (has(c, 'undying') ? -2 : 0) }); });
  cands.sort((x, y) => x.v - y.v);
  const sac = []; let sum = 0;
  for (const x of cands) {
    if (sum >= card.blood) break;
    sac.push(x.l); sum += bloodOf(x.c);
  }
  if (sum < card.blood) return null;
  // убрать лишние
  for (let i = sac.length - 1; i >= 0; i--) {
    const v = bloodOf(b.player[sac[i]]);
    if (sum - v >= card.blood) { sum -= v; sac.splice(i, 1); }
  }
  return sac;
}

function botAction(b) {
  if (b.result) return null;
  if (b.phase === 'draw') {
    const bloodCards = b.hand.filter(c => c.blood > 0);
    let fodder = b.hand.filter(c => c.id === 'polevka').length;
    for (const c of b.player) if (c && cardValue(c) <= 3.5) fodder += bloodOf(c);
    const need = bloodCards.length ? Math.min(...bloodCards.map(c => c.blood)) : 0;
    const wantMeat = (bloodCards.length && fodder < need) || (bloodCards.length >= 2 && fodder < 2);
    if ((wantMeat || !b.deck.length) && b.meat > 0) return { type: 'draw', source: 'meat' };
    return { type: 'draw', source: b.deck.length ? 'deck' : 'meat' };
  }
  if (b.phase !== 'main') return null;
  // предметы
  for (let i = 0; i < 3; i++) {
    const id = b.items[i];
    if (!id) continue;
    if (id === 'gvozd' && (b.scale === WIN_AT - 1 || b.scale <= -3)) return { type: 'item', idx: i };
    if (id === 'banka' && b.hand.some(c => c.blood > 0) && totalBlood(b) === 0 && !b.hand.some(c => c.id === 'polevka')) return { type: 'item', idx: i };
    if (id === 'meshok' && b.hand.some(c => c.bones > b.bones && c.bones <= b.bones + 3)) return { type: 'item', idx: i };
    if (id === 'mak' && b.scale <= -2 && b.enemy.reduce((s, c, l) => s + effAtk(b, 'enemy', l), 0) >= 3) return { type: 'item', idx: i };
    if (id === 'serp' || id === 'arkan') {
      const ts = itemTargets(b, id);
      let best = -1, bv = 0;
      for (const l of ts) { const v = cardValue(b.enemy[l]); if (v > bv) { bv = v; best = l; } }
      if (best >= 0 && (bv >= 7 || b.scale <= -3)) return { type: 'item', idx: i, target: best };
    }
  }
  // карты
  let bestAct = null, bestVal = 0.5;
  b.hand.forEach((card, hi) => {
    if (!canAfford(b, card)) return;
    if (card.blood > 0) {
      const sac = botChooseSacrifices(b, card);
      if (!sac) return;
      const lost = sac.reduce((s, l) => s + cardValue(b.player[l]) + laneScore(b, b.player[l], l) + 0.5, 0);
      const lanes = sac.slice();
      for (let l = 0; l < LANES; l++) if (!b.player[l]) lanes.push(l);
      for (const l of lanes) {
        const v = cardValue(card) + laneScore(b, card, l) - lost;
        if (v > bestVal) { bestVal = v; bestAct = { type: 'play', hand: hi, lane: l, sac }; }
      }
    } else {
      const isMeat = card.id === 'polevka';
      const needFodder = b.hand.some(c => c.blood > totalBlood(b));
      for (let l = 0; l < LANES; l++) {
        if (b.player[l]) continue;
        let v = isMeat ? (needFodder ? 1.5 : 0.2) + laneScore(b, card, l) * 0.6 : cardValue(card) + laneScore(b, card, l) - costValue(card) * 0.3;
        if (v > bestVal) { bestVal = v; bestAct = { type: 'play', hand: hi, lane: l, sac: [] }; }
      }
    }
  });
  if (bestAct) return bestAct;
  return { type: 'bell' };
}

/* Умный бот: перебирает ходы и смотрит, что будет после ответа противника (просчёт на один ход). */
function cloneBattle(b) {
  const rng = b.rng, ev = b.events;
  b.rng = null; b.events = [];
  const nb = JSON.parse(JSON.stringify(b));
  b.rng = rng; b.events = ev;
  nb.encounter = b.encounter;
  nb.rng = makeRng(rng.getState());
  return nb;
}
function evalBattle(b) {
  if (b.result === 'won') return 1000 + b.teeth;
  if (b.result === 'lost') return -1000;
  let v = b.scale * 7;
  for (let l = 0; l < LANES; l++) {
    const p = b.player[l], e = b.enemy[l], q = b.queue[l];
    if (p) v += cardValue(p) * (0.55 + 0.45 * p.hp / Math.max(1, p.maxHp)) + 0.6;
    if (e) v -= cardValue(e) * (0.55 + 0.45 * e.hp / Math.max(1, e.maxHp)) + effAtk(b, 'enemy', l) * (p ? 0.5 : 2.5);
    if (q) v -= cardValue(q) * 0.6 + (p || e ? 0 : q.atk * 1.5);
  }
  v += b.bones * 0.35 + b.hand.length * 0.6 + b.items.filter(Boolean).length * 1.5;
  // запас крови на столе: можно будет сыграть сильную карту в следующий ход
  const blood = totalBlood(b);
  let pot = 0;
  for (const c of b.hand) if (c.blood > 0 && c.blood <= blood + 1) pot = Math.max(pot, cardValue(c) * (c.blood <= blood ? 0.5 : 0.25));
  return v + pot;
}
function candidateActions(b) {
  const out = [{ type: 'bell' }];
  b.hand.forEach((card, hi) => {
    if (!canAfford(b, card)) return;
    if (card.blood > 0) {
      const sac = botChooseSacrifices(b, card);
      if (!sac) return;
      const lanes = sac.slice();
      for (let l = 0; l < LANES; l++) if (!b.player[l]) lanes.push(l);
      for (const l of lanes) out.push({ type: 'play', hand: hi, lane: l, sac });
    } else for (let l = 0; l < LANES; l++) if (!b.player[l]) out.push({ type: 'play', hand: hi, lane: l, sac: [] });
  });
  b.items.forEach((id, i) => {
    if (!id) return;
    const ts = itemTargets(b, id);
    if (ts) ts.forEach(t => out.push({ type: 'item', idx: i, target: t }));
    else out.push({ type: 'item', idx: i });
  });
  return out;
}
function smartAction(b) {
  if (b.result) return null;
  if (b.phase === 'draw') return botAction(b);
  if (b.phase !== 'main') return null;
  let best = null, bestV = -Infinity;
  for (const a of candidateActions(b)) {
    const nb = cloneBattle(b);
    if (!act(nb, a).ok) continue;
    if (a.type !== 'bell' && !nb.result) ringBell(nb);
    let v = evalBattle(nb);
    if (a.type === 'item') v -= 3.5; // предметы берегут
    if (a.type === 'bell') v += 0.3;
    if (v > bestV) { bestV = v; best = a; }
  }
  return best || { type: 'bell' };
}

function act(b, a) {
  if (!a) return fail('нет действия');
  if (a.type === 'draw') return draw(b, a.source);
  if (a.type === 'play') return play(b, a.hand, a.lane, a.sac);
  if (a.type === 'item') return useItem(b, a.idx, a.target);
  if (a.type === 'bell') return ringBell(b);
  return fail('неизвестное действие');
}

/* Прогнать бой ботом до конца. Возвращает результат и число ходов. */
function botBattle(b, maxActions, smart) {
  maxActions = maxActions || 2000;
  let n = 0;
  while (!b.result && n < maxActions) {
    const a = smart ? smartAction(b) : botAction(b);
    const r = act(b, a);
    if (!r.ok) { // защита от зацикливания бота: если ход не прошёл — звоним
      if (b.phase === 'draw') act(b, { type: 'draw', source: b.deck.length ? 'deck' : 'meat' });
      else act(b, { type: 'bell' });
    }
    n++;
  }
  return { result: b.result, turns: b.turn, actions: n };
}

/* =====================================================================
   ЗАБЕГ: карта, узлы, награды
   ===================================================================== */
function runRng(run) {
  const r = makeRng(run.rngState);
  return { r, save() { run.rngState = r.getState(); } };
}
function withRng(run, fn) { const x = runRng(run); const v = fn(x.r); x.save(); return v; }

function starterDeck() {
  return ['gornostay', 'gornostay', 'kvaksha', 'vorobey', 'volk', 'lisyonok'].map(id => makeCard(id));
}

function genMap(r, regionId) {
  const R = REGIONS[regionId];
  const layers = [];
  let nid = 0;
  const startNode = { id: 'n' + (nid++), type: 'start', layer: -1, x: 0.5, y: 0.97, next: [] };
  const nodes = { [startNode.id]: startNode };
  R.layers.forEach((L, li) => {
    let k = 1;
    if (L.kind === 'battle' && !L.tutorial) k = r.chance(0.5) ? 3 : 2;
    if (L.kind === 'event') k = r.chance(0.55) ? 3 : 2;
    const types = [];
    if (L.kind === 'battle') {
      if (L.tutorial) types.push('battle');
      else {
        const pool = r.shuffle(R.encounters[L.tier].slice());
        for (let i = 0; i < k; i++) types.push(i > 0 && r.chance(L.hardChance) ? 'hard' : 'battle');
        if (k >= 2 && types.every(t => t === 'battle') && r.chance(L.hardChance)) types[k - 1] = 'hard';
        r.shuffle(types);
        types._enc = types.map((t, i) => t === 'hard' ? r.pick(R.encounters[Math.min(4, L.tier + 1)]) : pool[i % pool.length]);
      }
    } else if (L.kind === 'event') {
      const w = Object.assign({}, R.events);
      if (L.must) { types.push(L.must); delete w[L.must]; }
      while (types.length < k) {
        const keys = Object.keys(w);
        const pick = r.weighted(keys, kk => w[kk]);
        types.push(pick); delete w[pick];
      }
      r.shuffle(types);
    } else if (L.kind === 'boss') types.push('boss');
    const row = [];
    for (let i = 0; i < types.length; i++) {
      const n = { id: 'n' + (nid++), type: types[i], layer: li, x: (i + 1) / (types.length + 1) + (r() - 0.5) * 0.08, y: 0.88 - (li / (R.layers.length - 1)) * 0.8 + (r() - 0.5) * 0.03, next: [] };
      if (L.kind === 'battle') { n.tier = L.tier || 0; n.encounter = L.tutorial ? 'tutorial' : types._enc[i]; if (L.tutorial) n.tutorial = true; }
      if (L.kind === 'boss') { n.boss = R.boss; n.x = 0.5; }
      nodes[n.id] = n; row.push(n.id);
    }
    layers.push(row);
  });
  // тропинки
  startNode.next = layers[0].slice();
  for (let li = 0; li < layers.length - 1; li++) {
    const A = layers[li].map(id => nodes[id]), B = layers[li + 1].map(id => nodes[id]);
    const edges = new Set();
    const key = (a, b) => a + '>' + b;
    // каждый узел А — к ближайшему в Б
    A.forEach((a, i) => { const j = Math.round(i * (B.length - 1) / Math.max(1, A.length - 1)); edges.add(key(i, j)); });
    // каждый узел Б должен иметь вход
    B.forEach((bn, j) => { if (![...edges].some(e => +e.split('>')[1] === j)) { const i = Math.round(j * (A.length - 1) / Math.max(1, B.length - 1)); edges.add(key(i, j)); } });
    // дополнительные развилки без пересечений
    for (let i = 0; i < A.length; i++) for (let j = 0; j < B.length; j++) {
      if (edges.has(key(i, j)) || !r.chance(0.45)) continue;
      const ok = [...edges].every(e => { const [ei, ej] = e.split('>').map(Number); return !((ei < i && ej > j) || (ei > i && ej < j)); });
      if (ok && Math.abs(i / Math.max(1, A.length - 1) - j / Math.max(1, B.length - 1)) <= 0.5) edges.add(key(i, j));
    }
    for (const e of edges) { const [i, j] = e.split('>').map(Number); A[i].next.push(B[j].id); }
  }
  return { nodes, layers, start: startNode.id, region: regionId };
}

function newRun(opts) {
  opts = opts || {};
  const seed = opts.seed != null ? opts.seed : (Date.now() ^ (Math.random() * 1e9)) >>> 0;
  const r = makeRng(seed);
  const run = {
    v: SAVE_VERSION, seed, region: 'forest', deck: starterDeck(), items: ['banka', null, null], teeth: 0,
    candles: 2, maxCandles: 2, map: null, pos: null, visited: [], pending: null, tutorial: opts.tutorial !== false,
    stats: { battles: 0, teeth: 0, cards: 0, startedAt: opts.now || 0 }, fireUses: 0, rngState: 0, uid: 0,
  };
  run.map = genMap(r, run.region);
  run.pos = run.map.start;
  run.rngState = r.getState();
  run.uid = UID;
  return run;
}

function syncUid(run) {
  let max = UID;
  const scan = c => { const n = parseInt(String(c.uid).slice(1), 10); if (n >= max) max = n + 1; };
  (run.deck || []).forEach(scan);
  if (run.uid > max) max = run.uid;
  UID = max; run.uid = UID;
}

function nextNodes(run) { const n = run.map.nodes[run.pos]; return n ? n.next.map(id => run.map.nodes[id]) : []; }
function moveTo(run, id) {
  const ok = nextNodes(run).some(n => n.id === id);
  if (!ok) return false;
  run.pos = id; run.pending = id;
  return true;
}
function completeNode(run, id) {
  if (run.visited.indexOf(id) < 0) run.visited.push(id);
  run.pending = null;
  run.uid = UID;
}

function battleOptions(run, node) {
  const seed = withRng(run, r => r.int(1e9));
  const o = { deck: run.deck, items: run.items, encounter: node.encounter, seed, kind: node.type };
  if (node.type === 'boss') { o.boss = node.boss; o.kind = 'boss'; }
  if (node.tutorial) { o.tutorial = run.tutorial; o.fixedOrder = run.tutorial; }
  return o;
}

// После боя: зубы, предметы, статистика
function finishBattle(run, b) {
  run.items = b.items.slice();
  if (b.result === 'won') {
    const bonus = b.kind === 'hard' ? 2 : (b.kind === 'boss' ? 0 : 1);
    run.teeth += b.teeth + bonus;
    run.stats.teeth += b.teeth + bonus;
    run.stats.battles++;
    return { teeth: b.teeth + bonus };
  }
  run.candles = Math.max(0, run.candles - 1);
  return { candles: run.candles, dead: run.candles <= 0 };
}

function pickCardIds(r, region, n, weights, exclude) {
  const R = REGIONS[region];
  const out = [];
  const pool = R.pool.filter(id => !(exclude || []).includes(id));
  let guard = 0;
  while (out.length < n && guard++ < 200) {
    const tier = r.weighted(Object.keys(weights), k => weights[k]);
    const cands = pool.filter(id => CARDS[id].tier === tier && out.indexOf(id) < 0);
    if (!cands.length) continue;
    out.push(r.pick(cands));
  }
  return out;
}

// Предложение для узла. Генерируется один раз и хранится в узле (перезагрузка страницы ничего не перекатывает).
function nodeOffer(run, node, deathPool) {
  if (node.offer) return node.offer;
  node.offer = withRng(run, r => {
    if (node.type === 'cards' || node.type === 'trophy') {
      const w = node.type === 'trophy' ? { uncommon: 5, rare: 4 } : { common: 6, uncommon: 3, rare: 1 };
      const ids = pickCardIds(r, run.region, 3, w);
      const cards = ids.map(id => makeCard(id));
      if (deathPool && deathPool.length && r.chance(node.type === 'trophy' ? 0.5 : 0.3)) cards[r.int(3)] = Object.assign(cloneCard(r.pick(deathPool)), { uid: newUid() });
      return { cards };
    }
    if (node.type === 'backpack') {
      const ids = r.shuffle(Object.keys(ITEMS).slice()).slice(0, 3);
      return { items: ids };
    }
    if (node.type === 'shop') {
      const ids = pickCardIds(r, run.region, 3, { common: 4, uncommon: 4, rare: 2 });
      const cards = ids.map(id => { const c = makeCard(id); return { card: c, price: PRICES[CARDS[id].tier] }; });
      if (deathPool && deathPool.length && r.chance(0.5)) { const d = Object.assign(cloneCard(r.pick(deathPool)), { uid: newUid() }); cards[2] = { card: d, price: PRICES.death }; }
      const items = r.shuffle(Object.keys(ITEMS).slice()).slice(0, 2).map(id => ({ id, price: ITEMS[id].price }));
      return { cards, items, sold: [] };
    }
    return {};
  });
  run.uid = UID;
  return node.offer;
}

// Награда за сложный бой — выбор из трёх карт получше. Хранится в узле, как и остальные предложения.
function trophyOffer(run, node, deathPool) {
  if (!node.trophy) node.trophy = { type: 'trophy' };
  return nodeOffer(run, node.trophy, deathPool);
}

function takeCard(run, card) {
  const c = cloneCard(card);
  c.uid = newUid();
  run.deck.push(c); run.stats.cards++;
  run.uid = UID;
  return c;
}

function freeSlot(run) { return run.items.findIndex(x => !x); }
function takeItem(run, id, slot) {
  if (slot == null) slot = freeSlot(run);
  if (slot < 0 || slot > 2) return false;
  run.items[slot] = id;
  return true;
}

function buy(run, node, kind, idx) {
  const o = node.offer;
  if (!o) return { ok: false, error: 'Лавка закрыта' };
  const key = kind + idx;
  if (o.sold.indexOf(key) >= 0) return { ok: false, error: 'Уже продано' };
  if (kind === 'card') {
    const it = o.cards[idx];
    if (run.teeth < it.price) return { ok: false, error: 'Не хватает зубов' };
    run.teeth -= it.price; o.sold.push(key);
    return { ok: true, card: takeCard(run, it.card) };
  }
  const it = o.items[idx];
  if (run.teeth < it.price) return { ok: false, error: 'Не хватает зубов' };
  if (freeSlot(run) < 0) return { ok: false, error: 'Все карманы заняты' };
  run.teeth -= it.price; o.sold.push(key);
  takeItem(run, it.id);
  return { ok: true, item: it.id };
}

const MIN_DECK = 4;
const FIRE_RISK = [0, 0.35, 0.65, 0.9];
function fireRisk(attempt) { return FIRE_RISK[Math.min(attempt, FIRE_RISK.length - 1)]; }
// Костёр: +1 атака или +2 здоровья. Первая попытка безопасна, дальше тени могут съесть карту.
function fireUpgrade(run, uid, stat, attempt) {
  const c = run.deck.find(x => x.uid === uid);
  if (!c) return { ok: false };
  const risk = fireRisk(attempt);
  const eaten = withRng(run, r => r() < risk);
  if (eaten && run.deck.length > MIN_DECK) {
    run.deck.splice(run.deck.indexOf(c), 1);
    return { ok: true, eaten: true, card: c };
  }
  if (stat === 'atk') { c.atk += 1; c.buffAtk = (c.buffAtk || 0) + 1; }
  else { c.hp += 2; c.buffHp = (c.buffHp || 0) + 2; }
  return { ok: true, eaten: false, card: c };
}

function altarCandidates(run) { return run.deck.filter(c => c.sigils.length > 0); }
function altarTargets(run, sacUid) {
  const s = run.deck.find(x => x.uid === sacUid);
  if (!s) return [];
  return run.deck.filter(c => c.uid !== sacUid && c.sigils.length < MAX_SIGILS && s.sigils.some(g => c.sigils.indexOf(g) < 0));
}
function altar(run, sacUid, targetUid) {
  if (run.deck.length <= MIN_DECK) return { ok: false, error: 'Колода и так тоньше некуда' };
  const s = run.deck.find(x => x.uid === sacUid), t = run.deck.find(x => x.uid === targetUid);
  if (!s || !t || s === t) return { ok: false, error: 'Так нельзя' };
  const g = s.sigils.find(x => t.sigils.indexOf(x) < 0);
  if (!g || t.sigils.length >= MAX_SIGILS) return { ok: false, error: 'Некуда переносить' };
  // «Растёт» без взрослой формы бесполезен — переносим, но карта не вырастет; поэтому запрещаем
  if (g === 'grows' && !t.evolve) return { ok: false, error: 'Этой карте некуда расти' };
  run.deck.splice(run.deck.indexOf(s), 1);
  t.sigils.push(g);
  return { ok: true, sigil: g, card: t };
}

function mergePairs(run) {
  const by = {};
  for (const c of run.deck) { if (c.death || c.id === 'polevka') continue; (by[c.id] = by[c.id] || []).push(c); }
  return Object.values(by).filter(a => a.length >= 2);
}
function merge(run, uidA, uidB) {
  const a = run.deck.find(x => x.uid === uidA), b = run.deck.find(x => x.uid === uidB);
  if (!a || !b || a === b || a.id !== b.id) return { ok: false, error: 'Сращивать можно только одинаковые карты' };
  a.atk += b.atk; a.hp += b.hp;
  a.buffAtk = (a.buffAtk || 0) + b.atk; a.buffHp = (a.buffHp || 0) + b.hp;
  for (const s of b.sigils) if (a.sigils.indexOf(s) < 0 && a.sigils.length < MAX_SIGILS) a.sigils.push(s);
  a.fused = true;
  run.deck.splice(run.deck.indexOf(b), 1);
  return { ok: true, card: a };
}

// Карта смерти: цена от первой, атака/здоровье от второй, сигилы от третьей.
function makeDeathCard(costCard, statCard, sigilCard, name) {
  return {
    uid: newUid(), id: 'death', name: (name || 'Безымянный').slice(0, 11), blood: costCard.blood, bones: costCard.bones,
    atk: statCard.atk, hp: statCard.hp, sigils: sigilCard.sigils.slice(0, MAX_SIGILS), evolve: null,
    art: costCard.art || costCard.id, buffAtk: 0, buffHp: 0, fused: false,
    death: { arts: [costCard.art || costCard.id, statCard.art || statCard.id, sigilCard.art || sigilCard.id] },
  };
}
function deathName(a, b, c) {
  const part = (s, from, len) => s.name.replace(/[^А-Яа-яЁё]/g, '').slice(from, from + len);
  let n = part(a, 0, 3) + part(b, 1, 3).toLowerCase() + part(c, Math.max(0, c.name.length - 3), 3).toLowerCase();
  return n.charAt(0).toUpperCase() + n.slice(1).toLowerCase();
}

// Бот для забега: выбирает узлы и награды
function botRunChoice(run, node, deathPool) {
  const r = runRng(run);
  const res = {};
  if (node.type === 'cards' || node.type === 'trophy') {
    const o = nodeOffer(run, node, deathPool);
    let best = o.cards[0];
    for (const c of o.cards) if (cardValue(c) - costValue(c) > cardValue(best) - costValue(best)) best = c;
    takeCard(run, best); res.took = best.name;
  } else if (node.type === 'backpack') {
    const o = nodeOffer(run, node);
    const slot = freeSlot(run);
    if (slot >= 0) { takeItem(run, o.items[0], slot); res.took = o.items[0]; }
  } else if (node.type === 'fire') {
    let best = run.deck[0];
    for (const c of run.deck) if (cardValue(c) > cardValue(best)) best = c;
    fireUpgrade(run, best.uid, best.atk >= 2 ? 'atk' : 'hp', 0);
    res.fire = best.name;
  } else if (node.type === 'merge') {
    const p = mergePairs(run);
    if (p.length) { merge(run, p[0][0].uid, p[0][1].uid); res.merged = p[0][0].name; }
  } else if (node.type === 'altar') {
    const cands = altarCandidates(run).filter(c => cardValue(c) < 6);
    for (const s of cands) {
      const ts = altarTargets(run, s.uid).sort((x, y) => cardValue(y) - cardValue(x));
      if (ts.length) { const a = altar(run, s.uid, ts[0].uid); if (a.ok) { res.altar = a.sigil; break; } }
    }
  } else if (node.type === 'shop') {
    const o = nodeOffer(run, node, deathPool);
    o.cards.forEach((it, i) => { if (run.teeth >= it.price && cardValue(it.card) > 6) buy(run, node, 'card', i); });
  }
  r.save && 0;
  return res;
}

/* --- Сохранение (сама запись в localStorage — в коде интерфейса) --- */
function serializeRun(run) { run.uid = UID; return JSON.stringify(run); }
function deserializeRun(s) {
  try {
    const run = JSON.parse(s);
    if (!run || run.v !== SAVE_VERSION || !run.map || !run.deck) return null;
    syncUid(run);
    return run;
  } catch (e) { return null; }
}

  LANES, WIN_AT, MEAT_PER_BATTLE, PATIENCE_TURN, MAX_SIGILS, MIN_DECK,

  makeRng, makeCard, cloneCard, has, cardValue, costValue, cardTier, snap,

  fireUpgrade, fireRisk, altarCandidates, altarTargets, altar, mergePairs, merge, makeDeathCard, deathName,
  serializeRun, deserializeRun, syncUid,
};
})(typeof window !== 'undefined' ? window : globalThis);
</script>

// Растеризация рисунка в массив 28×20 (0 — бумага, 1 — тушь, 2 — штрих, 3 — кровь)
const artCache = {};
function rasterArt(id) {
  if (artCache[id]) return artCache[id];
  const g = new Uint8Array(ART_W * ART_H);
  const set = (x, y, c) => {
    if (x < 0 || y < 0 || x >= ART_W || y >= ART_H) return;
    if (c === 2) c = ((x + y) & 1) ? 1 : 0; // штриховка через пиксель
    g[y * ART_W + x] = c;
  };
  const cmds = ARTS[id] || ARTS.polevka;
  for (const cm of cmds) {
    const k = cm[0];
    if (k === 'e') { const [, cx, cy, rx, ry, c] = cm; for (let y = 0; y < ART_H; y++) for (let x = 0; x < ART_W; x++) { const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry; if (dx * dx + dy * dy <= 1) set(x, y, c); } }
    else if (k === 'r') { const [, x0, y0, w, h, c] = cm; for (let y = Math.floor(y0); y < y0 + h; y++) for (let x = Math.floor(x0); x < x0 + w; x++) set(x, y, c); }
    else if (k === 'p') set(cm[1], cm[2], cm[3]);
    else if (k === 't') {
      const [, x1, y1, x2, y2, x3, y3, c] = cm;
      const ed = (ax, ay, bx, by, px, py) => (bx - ax) * (py - ay) - (by - ay) * (px - ax);
      for (let y = 0; y < ART_H; y++) for (let x = 0; x < ART_W; x++) {
        const px = x + 0.5, py = y + 0.5;
        const a = ed(x1, y1, x2, y2, px, py), b = ed(x2, y2, x3, y3, px, py), d = ed(x3, y3, x1, y1, px, py);
        if ((a >= 0 && b >= 0 && d >= 0) || (a <= 0 && b <= 0 && d <= 0)) set(x, y, c);
      }
    } else if (k === 'l') {
      const [, x1, y1, x2, y2, w, c] = cm;
      const vx = x2 - x1, vy = y2 - y1, len2 = vx * vx + vy * vy || 1;
      for (let y = 0; y < ART_H; y++) for (let x = 0; x < ART_W; x++) {
        const px = x + 0.5, py = y + 0.5;
        let t = ((px - x1) * vx + (py - y1) * vy) / len2; t = Math.max(0, Math.min(1, t));
        const dx = px - (x1 + vx * t), dy = py - (y1 + vy * t);
        if (dx * dx + dy * dy <= (w / 2) * (w / 2) + 0.05) set(x, y, c);
      }
    }
  }
  artCache[id] = g;
  return g;
}
function drawArt(ctx, id, x, y, s, clip) {
  const g = rasterArt(id);
  for (let j = 0; j < ART_H; j++) for (let i = 0; i < ART_W; i++) {
    if (clip && (i < clip[0] || i >= clip[1])) continue;
    const v = g[j * ART_W + i];
    if (!v) continue;
    ctx.fillStyle = v === 3 ? PAL.blood : PAL.ink;
    ctx.fillRect(x + i * s, y + j * s, s, s);
  }
}

function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
RAMP.forEach((h, i) => { const [r, g, b] = hexRgb(h); palData.set([r, g, b, 255], i * 4); });

const postMat = new THREE.ShaderMaterial({
  uniforms: { tDiffuse: { value: rt.texture }, tPal: { value: palTex }, time: { value: 0 }, ca: { value: 0.0035 }, grain: { value: 0.06 }, levels: { value: RAMP.length }, alevels: { value: ACCENT.length }, bright: { value: 1.25 } },
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform sampler2D tPal; uniform float time; uniform float ca; uniform float grain; uniform float levels; uniform float alevels; uniform float bright;
    varying vec2 vUv;
    float bayer2(vec2 a){ a = floor(a); return fract(a.x / 2.0 + a.y * a.y * 0.75); }
    float bayer4(vec2 a){ return bayer2(0.5 * a) * 0.25 + bayer2(a); }
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 d = vUv - 0.5;
      float r2 = dot(d, d);
      vec2 off = d * ca * (0.5 + r2 * 3.0);
      vec3 c0 = texture2D(tDiffuse, vUv).rgb;
      vec3 c;
      c.r = texture2D(tDiffuse, vUv + off).r;
      c.g = c0.g;
      c.b = texture2D(tDiffuse, vUv - off).b;
      float vig = 1.0 - smoothstep(0.1, 0.5, r2);
      // акцент — только насыщенный красный, и определяем его по центральной выборке, без аберрации
      bool acc = c0.r > 0.12 && c0.g < c0.r * 0.45 && c0.b < c0.r * 0.45;
      float lum = dot(c, vec3(0.3, 0.59, 0.11));
      if (acc) lum = c0.r * 0.95;
      lum *= mix(0.45, 1.0, vig) * bright;
      lum = pow(max(lum, 0.0), 0.85) * 1.1;
      lum += (hash(gl_FragCoord.xy + floor(time * 24.0) * 17.0) - 0.5) * grain;
      float dith = bayer4(gl_FragCoord.xy) - 0.5;
      float n = acc ? alevels : levels;
      float idx = clamp(floor(clamp(lum, 0.0, 1.0) * (n - 1.0) + 0.5 + dith * 0.85), 0.0, n - 1.0);
      vec3 col = texture2D(tPal, vec2((idx + 0.5) / 16.0, acc ? 0.75 : 0.25)).rgb;
      gl_FragColor = vec4(col, 1.0);
    }`,
  depthTest: false, depthWrite: false,
});

  const rot = document.getElementById('rotate'); if (rot) rot.hidden = !(IS_TOUCH && aspect < 0.8);
  const tanV0 = Math.tan(THREE.MathUtils.degToRad(27));
  const needH = 0.93; // нужная горизонтальная половина тангенса
  let tanV = Math.max(tanV0, needH / aspect);

  camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(tanV));
  viewScale = Math.max(1, needH / (tanV * aspect));

}

function makeSlate(w, h, scale = 2) {
  const cw = Math.round(w * 110), ch = Math.round(h * 110);
  const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch;
  const tex = canvasTex(cv);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshPhongMaterial({ map: tex, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: 0.25, transparent: true, shininess: 1 }));
  m.receiveShadow = true;
  let last = null;
  return {
    mesh: m,
    set(text, color = PAL.bone) {
      if (text === last) return; last = text;
      const ctx = cv.getContext('2d'); ctx.clearRect(0, 0, cw, ch);
      ctx.fillStyle = 'rgba(14,11,8,0.85)'; ctx.fillRect(0, 0, cw, ch);
      let sc = scale; while (sc > 1 && textWidth(text) * sc > cw - 4) sc--;
      drawTextCentered(ctx, text, cw / 2, Math.round(ch / 2 - 2.5 * sc), color, sc, cw - 4);
      tex.needsUpdate = true;
    },
  };
}

const sfx = {
  ctx: null, master: null, on: true, drone: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume().catch(() => {}); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;

      this.master = this.ctx.createGain(); this.master.gain.value = this.on ? 0.8 : 0;
      const comp = this.ctx.createDynamicsCompressor();

      this.noiseBuf = this.ctx.createBuffer(1, this.ctx.sampleRate * 2, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0); let last = 0;
      for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = i % 2 ? w : last * 3.5; }
      this.startDrone();
    } catch (e) { this.ctx = null; }
  },
  setOn(v) { this.on = v; if (this.master) this.master.gain.setTargetAtTime(v ? 0.8 : 0, this.ctx.currentTime, 0.1); },
  t() { return this.ctx.currentTime; },
  env(g, t, a, peak, dec) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + dec); },
  osc(type, f, t, dur, peak, dest, f2) {

    this.env(g, t, 0.005, peak, dur); o.connect(g); g.connect(dest || this.master); o.start(t); o.stop(t + dur + 0.05);
  },
  noise(t, dur, peak, type, freq, q, dest, f2) {
    const s = this.ctx.createBufferSource(); s.buffer = this.noiseBuf; s.loop = true;
    const f = this.ctx.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.setValueAtTime(freq || 1000, t); if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur); f.Q.value = q || 1;
    const g = this.ctx.createGain(); this.env(g, t, 0.004, peak, dur);
    s.connect(f); f.connect(g); g.connect(dest || this.master); s.start(t, Math.random()); s.stop(t + dur + 0.05);
  },
  startDrone() {
    const c = this.ctx, t = c.currentTime;
    const g = c.createGain(); g.gain.value = 0; g.gain.linearRampToValueAtTime(0.11, t + 4);
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 140; f.Q.value = 3;
    const lfo = c.createOscillator(), lg = c.createGain(); lfo.frequency.value = 0.07; lg.gain.value = 50; lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    for (const fr of [41.2, 41.9, 61.7]) { const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = fr; o.connect(f); o.start(); }
    const wind = c.createBufferSource(); wind.buffer = this.noiseBuf; wind.loop = true;
    const wf = c.createBiquadFilter(); wf.type = 'bandpass'; wf.frequency.value = 320; wf.Q.value = 0.6;
    const wg = c.createGain(); wg.gain.value = 0.05; wind.connect(wf); wf.connect(wg); wg.connect(g); wind.start();

  tense(v) { if (this.drone) this.drone.f.frequency.setTargetAtTime(v ? 260 : 140, this.ctx.currentTime, 1.5); },

      case 'tick': this.noise(t, 0.02, 0.25, 'highpass', 3000); break;
      case 'grow': this.osc('triangle', 300, t, 0.3, 0.15, null, 700); break;

      case 'prick': this.osc('sine', 2200, t, 0.08, 0.2); this.noise(t, 0.05, 0.2, 'highpass', 5000); break;

      case 'step': this.noise(t, 0.04, 0.25, 'bandpass', 600, 3); this.osc('sine', 180, t, 0.05, 0.15, null, 90); break;
      case 'win': [196, 247, 294, 392].forEach((f, i) => this.osc('triangle', f, t + i * 0.12, 1.2, 0.12)); break;
      case 'lose': [220, 185, 147, 110].forEach((f, i) => this.osc('sawtooth', f, t + i * 0.18, 0.9, 0.07)); break;
      case 'deny': this.osc('square', 110, t, 0.12, 0.08); this.osc('square', 98, t + 0.1, 0.15, 0.08); break;
      case 'coin': this.osc('triangle', 1400, t, 0.08, 0.12); this.osc('triangle', 1900, t + 0.06, 0.1, 0.1); break;

/* =====================================================================
   АНИМАЦИИ: твины на промисах
   ===================================================================== */
const tweens = new Set();
let NOW = performance.now();
const ease = { lin: k => k, out: k => 1 - (1 - k) * (1 - k), inOut: k => k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2, back: k => { const c = 1.7; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); } };
function tween(ms, fn, e = ease.inOut) {
  return new Promise(res => {
    const dur = ms / SPEED;
    if (dur < 4) { fn(1); res(); return; }
    tweens.add({ t0: NOW, dur, fn, e, res });
  });
}
function wait(ms) { return tween(ms, () => {}); }
function updateTweens() {
  for (const tw of tweens) {
    let k = (NOW - tw.t0) / tw.dur;
    if (k >= 1) k = 1;
    try { tw.fn(tw.e(k)); } catch (err) { console.error(err); k = 1; }
    if (k >= 1) { tweens.delete(tw); tw.res(); }
  }
}

  floatText(text, world, cls) {
    const p = world.clone().project(camera);
    if (p.z > 1) return;
    const r = app.getBoundingClientRect();
    const el = document.createElement('div'); el.className = 'float ' + (cls || ''); el.textContent = text;
    el.style.left = ((p.x + 1) / 2 * r.width) + 'px'; el.style.top = ((1 - p.y) / 2 * r.height) + 'px';
    app.appendChild(el);
    const t0 = performance.now(), dur = 900 / Math.min(SPEED, 4);
    const step = () => { const k = (performance.now() - t0) / dur; el.style.transform = `translate(-50%, ${-50 - k * 60}%)`; el.style.opacity = String(1 - k * k); if (k < 1) requestAnimationFrame(step); else el.remove(); };
    requestAnimationFrame(step);
  },
  choices(opts) {
    // opts: [{label, value, red, disabled}]
    const box = $('choices');

  },

/* ---------- Многоглазый говорит ---------- */
const talk = { active: false, resolve: null, timer: null, full: '', shown: 0, waitClick: false };
async function say(text, opts = {}) {
  if (!text) return;
  const block = opts.wait !== false;
  const prevView = cam.name;
  if (opts.look) setView('host');
  const box = $('dialog');
  box.hidden = false;
  box.querySelector('.more').hidden = true;
  const el = box.querySelector('.text');
  talk.full = text; talk.shown = 0; talk.active = true;
  host.talk = 1;
  if (talk.timer) clearInterval(talk.timer);
  const fast = SPEED > 4;
  await new Promise(res => {
    if (fast) { el.textContent = text; res(); return; }
    let n = 0;
    talk.skip = () => { n = text.length; };
    talk.timer = setInterval(() => {
      n += 1;
      if (n % 3 === 1 && text[n - 1] && text[n - 1] !== ' ') sfx.play('voice');
      el.textContent = text.slice(0, n);
      if (n >= text.length) { clearInterval(talk.timer); talk.timer = null; res(); }
    }, 28);
  });
  talk.skip = null;
  host.talk = 0;
  if (block) {
    box.querySelector('.more').hidden = false;
    if (!(SPEED > 4 && G.autoDialog)) await new Promise(res => { talk.resolve = res; talk.waitClick = true; });
    talk.waitClick = false;
    box.hidden = true;
  } else {
    const myText = text;
    setTimeout(() => { if (talk.full === myText && !talk.waitClick) box.hidden = true; }, Math.max(1800, text.length * 55) / Math.min(SPEED, 4));
  }
  talk.active = false;
  if (opts.look) setView(opts.back || (prevView === 'host' ? 'table' : prevView));
}
function advanceDialog() {
  if (talk.skip) { talk.skip(); return true; }
  if (talk.waitClick && talk.resolve) { const r = talk.resolve; talk.resolve = null; r(); return true; }
  return false;
}
let lastQuip = 0;
function quip(key, chance = 0.5) {
  if (G.quiet || talk.waitClick) return;
  const now = performance.now();
  if (now - lastQuip < 6000 || Math.random() > chance) return;
  lastQuip = now;
  say(pick(LINES[key]), { wait: false });
}

/* ---------- Жизнь Многоглазого: взгляд, моргание, рот, руки ---------- */
const gazeTarget = new V3(0, 3, 4);
function updateHost(dt, time) {
  // взгляд: на курсор над столом или на камеру
  const want = G.gazeAt ? G.gazeAt : camera.position;
  gazeTarget.lerp(want, 1 - Math.exp(-dt * 6));
  const sleeping = host.sleep > 0;
  const tmp = new V3();
  for (const e of host.eyes) {
    e.next -= dt;
    if (e.next <= 0 && e.blink <= 0) { e.blink = 0.18; e.next = 1.5 + Math.random() * 6; if (Math.random() < 0.25) for (const o of host.eyes) if (o.blink <= 0) { o.blink = 0.18; o.next = 1.5 + Math.random() * 6; } }
    if (e.blink > 0) e.blink -= dt;
    const open = sleeping ? 0.08 : (e.blink > 0 ? Math.abs(e.blink / 0.18 * 2 - 1) * 0.92 + 0.08 : 1);
    e.open += (open - e.open) * Math.min(1, dt * 20);
    e.lid.scale.y = Math.max(0.06, e.open);
    tmp.copy(gazeTarget).add(e.jitter);
    e.ball.lookAt(tmp);
  }
  host.head.rotation.y = Math.sin(time * 0.4) * 0.05 + (gazeTarget.x - 0) * 0.02;
  host.head.rotation.x = Math.sin(time * 0.31) * 0.03 + 0.08;
  host.head.position.y = 2.05 + Math.sin(time * 0.9) * 0.015;
  const mo = host.talk ? 0.6 + Math.abs(Math.sin(time * 17)) * 1.6 : 1;
  host.mouth.scale.y += (mo - host.mouth.scale.y) * Math.min(1, dt * 15);
  for (const h of host.hands) {
    h.tap += dt;
    h.fingers.forEach((f, i) => { f.rotation.x = 0.15 + Math.max(0, Math.sin(h.tap * 3 - i * 0.7)) * 0.25 * (sleeping ? 0 : 1); });
  }
}
async function hostReach(target, side) {
  const h = host.hands[side != null ? side : (target.x < 0 ? 0 : 1)];
  const from = h.home.clone();
  const to = new V3(target.x * 0.9, 0.25, Math.min(target.z - 0.3, -0.8));
  await tween(220, k => h.g.position.lerpVectors(from, to, k), ease.out);
  await tween(260, k => h.g.position.lerpVectors(to, from, k), ease.inOut);
}

/* ---------- Ввод: мышь и касания ---------- */
const raycaster = new THREE.Raycaster();
const pointer = { x: 0, y: 0, ndc: new THREE.Vector2(), down: null, cx: 0, cy: 0, has: false };
function isShown(o) { while (o) { if (!o.visible) return false; o = o.parent; } return true; }
function inHand(o) { while (o) { if (o === handRoot) return true; o = o.parent; } return false; }
function pickHit(ndc) {
  raycaster.setFromCamera(ndc, camera);
  let hits = raycaster.intersectObjects(scene.children, true);
  // пока выбираешь клетку или жертву, рука не мешает: клик проходит сквозь неё к столу
  const placing = G.mode === 'place' || G.mode === 'sacrifice' || G.mode === 'itemTarget';
  if (placing && hits.some(h => !inHand(h.object))) hits = hits.filter(h => !inHand(h.object));
  for (const h of hits) {
    if (!isShown(h.object)) continue;
    if (h.object.material && h.object.material.transparent && h.object.material.opacity === 0 && !h.object.userData.hit) continue;
    let o = h.object;
    while (o && !o.userData.hit) o = o.parent;
    if (o) return Object.assign({ point: h.point, uv: h.uv }, o.userData.hit);
    if (h.object.userData.noBlock) continue;
    return null;
  }
  return null;
}
function setPointer(ev) {
  const r = app.getBoundingClientRect();
  pointer.cx = ev.clientX - r.left; pointer.cy = ev.clientY - r.top;
  pointer.ndc.set(pointer.cx / r.width * 2 - 1, -(pointer.cy / r.height) * 2 + 1);
  pointer.x = pointer.ndc.x; pointer.y = pointer.ndc.y; pointer.has = true;
}
canvas.addEventListener('pointermove', ev => { setPointer(ev); if (ev.pointerType !== 'touch') onHover(); });
canvas.addEventListener('pointerdown', ev => { setPointer(ev); pointer.down = { x: ev.clientX, y: ev.clientY, t: performance.now(), type: ev.pointerType }; sfx.init(); });
canvas.addEventListener('pointerup', ev => {
  setPointer(ev);
  const d = pointer.down; pointer.down = null;
  if (!d || Math.hypot(ev.clientX - d.x, ev.clientY - d.y) > 14) return;
  if (ev.button === 2) { cancelSel(); return; }
  if (ev.pointerType === 'touch') onHover();
  handleClick(pickHit(pointer.ndc));
});
canvas.addEventListener('contextmenu', ev => { ev.preventDefault(); cancelSel(); });
window.addEventListener('keydown', ev => {
  if (ev.target && ev.target.tagName === 'INPUT') return;
  if (ev.key === 'Escape') { if (!$('helpview').hidden) { $('helpview').hidden = true; return; } if (!$('deckview').hidden) { $('deckview').hidden = true; return; } cancelSel(); }
  if (ev.key === ' ' || ev.key === 'Enter') { if (advanceDialog()) ev.preventDefault(); }
});

function handleClick(hit) {
  if (talk.waitClick || talk.skip) { advanceDialog(); return; }
  if (hit && hit.kind === 'host') { quip('poke', 1); return; }
  if (G.click) G.click(hit);
}

function cardHint(uid) {

    const c = b.hand[hi];

    if (c.blood > L.totalBlood(b)) return 'Не хватает крови: на столе ' + L.totalBlood(b) + '.';

  if (b) {
    for (const row of ['player', 'enemy', 'queue']) for (const c of b[row]) if (c && c.uid === uid) return c;
    for (const c of b.hand) if (c.uid === uid) return c;

/* ---------- Карты: создание, рука, синхронизация ---------- */
function spawnCard(card, pos, quat, role = 'battle', space = 'world') {

}
function killObj(o, how) {

  else { o.tp.y += 0.15; o.tq.setFromEuler(new THREE.Euler(0, 0, (Math.random() - 0.5) * 1.2)); }
  setTimeout(() => { G.fx.delete(o); o.dispose(); }, 450 / Math.min(SPEED, 10));
}
function clearCards(role) {
  for (const o of [...G.objs.values()]) if (!role || o.role === role) { G.objs.delete(o.uid); o.dispose(); }
}
const tmpQ = new Q();
function layoutHand() {
  const b = G.b;
  if (!b) return;
  const n = b.hand.length;
  const spacing = n > 1 ? Math.min(0.3, (handLimit * 2 - 0.3) / (n - 1)) : 0;
  b.hand.forEach((c, i) => {
    const o = G.objs.get(c.uid); if (!o) return;
    o.setSpace('hand');
    const x = (i - (n - 1) / 2) * spacing;

    const y = (hov ? 0.08 : 0) + (sel ? 0.1 : 0);

    o.target(new V3(x, y - Math.abs(x) * 0.05, i * 0.004 + (hov || sel ? 0.1 : 0)), tmpQ.clone().multiply(HAND_Q), hov ? 0.48 : 0.36);
    o.dim = b.phase === 'main' && !L.canAfford(b, c) && !sel;

}
function faceKey(c, opts) { return [c.name, c.atk, c.hp, c.maxHp, c.sigils.join(), c.id, opts && opts.atk, opts && opts.atkBuff].join('|'); }
function updateFace(o, c, opts) {

}
function syncBoard() {
  const b = G.b; if (!b) return;

  for (const row of ['player', 'enemy', 'queue']) b[row].forEach((c, lane) => {
    if (!c) return;
    live.add(c.uid);
    let o = G.objs.get(c.uid);
    if (!o) o = spawnCard(c, slotPos(row, lane).add(new V3(0, 0.8, row === 'player' ? 0.6 : -0.6)));
    o.setSpace('world');
    o.target(slotPos(row, lane), FLAT, 1);
    o.dim = false;
    const ea = row === 'queue' ? c.atk : L.effAtk(b, row, lane);
    updateFace(o, c, { atk: ea, atkBuff: ea > c.atk });
    o.mark.visible = !!(G.sel && G.sel.sac && row === 'player' && G.sel.sac.indexOf(lane) >= 0);
  });
  b.hand.forEach(c => {
    live.add(c.uid);
    let o = G.objs.get(c.uid);

function objPos(uid) { const o = G.objs.get(uid); return o ? o.g.getWorldPosition(new V3()) : new V3(); }

/* ---------- Режимы ввода в бою ---------- */
function setModeFromPhase() {
  const b = G.b; if (!b || b.result) return;
  G.mode = b.phase === 'draw' ? 'draw' : 'idle';
  G.sel = null;
  refreshModeUI();
}
function refreshModeUI() {
  const b = G.b; if (!b) return;

  if (m === 'draw') ui.prompt('Возьми карту: <b>колода</b> или <b>полёвки</b> — стопки справа');
  else if (m === 'idle') {
    const any = b.hand.some(c => L.canAfford(b, c));
    ui.prompt(any ? 'Твой ход. Разыгрывай карты, потом звони в <b>колокольчик</b>' : 'Сыграть нечего — звони в <b>колокольчик</b>');
  } else if (m === 'sacrifice') {
    const got = G.sel.sac.reduce((s, l) => s + L.bloodOf(b.player[l]), 0);
    ui.prompt('Нужно крови: <b>' + G.sel.need + '</b>. Нажми на своих зверей на столе (выбрано ' + got + '). Отмена — ' + touch);
  } else if (m === 'place') ui.prompt('Выбери клетку в своём ряду. Отмена — ' + touch);
  else if (m === 'itemTarget') ui.prompt('Выбери карту противника. Отмена — ' + touch);
  else if (m === 'itemConfirm') { const it = L.ITEMS[b.items[G.sel.item]]; ui.prompt('<b>' + it.name + '</b>: ' + it.desc + ' Нажми на предмет ещё раз, чтобы применить.'); }

    let on = false;

    if (m === 'sacrifice' && row === 'player') on = !!b.player[l] && G.sel.sac.indexOf(l) < 0;
    if (m === 'itemTarget' && row === 'enemy') on = L.itemTargets(b, b.items[G.sel.item]).indexOf(l) >= 0;
